<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review Lokal — Food Delivery</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --line: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22c55e;
      --warn: #f59e0b;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    h1 { margin: 0; font-size: 20px; }
    .muted { color: var(--muted); font-size: 13px; }
    main { padding: 24px; display: grid; gap: 20px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button, select {
      background: #334155;
      color: var(--text);
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: #052e16; font-weight: 700; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
    }
    .card b { display: block; font-size: 20px; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    pre {
      background: #020617;
      padding: 12px;
      border-radius: 8px;
      overflow: auto;
      font-size: 12px;
    }
    .ok { color: var(--accent); }
    .warn { color: var(--warn); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Food Delivery — Review Lokal (SQLite)</h1>
      <div class="muted">Firebase ditunda. Data ada di <code>data/local.db</code>. Password semua akun: <b>password123</b></div>
    </div>
    <div class="row">
      <a href="/customer.html"><button class="primary">UI Customer + GPS</button></a>
      <a href="/courier.html"><button>UI Kurir GPS</button></a>
      <span id="logins"></span>
    </div>
  </header>
  <main>
    <section class="card">
      <div class="muted">Sesi</div>
      <div id="session">Belum login</div>
    </section>
    <section>
      <div class="cards" id="kpis"></div>
    </section>
    <section class="card">
      <h3>Aksi uji coba</h3>
      <div class="row">
        <button class="primary" onclick="createSample('single')">Buat order contoh PRD (Rp100.000 + 5km)</button>
        <button onclick="createSample('multi')">Buat order multi-outlet</button>
        <button onclick="advanceMerchant()">Outlet terima + siap</button>
        <button onclick="advanceCourier()">Kurir ambil + antar + selesai</button>
        <button onclick="payBill()">Outlet bayar tagihan</button>
        <button onclick="verifyBill()">Admin verifikasi settlement</button>
        <a href="http://localhost:5555" target="_blank"><button>Buka Prisma Studio</button></a>
      </div>
      <p class="muted">Order contoh memakai jarak billed 5 km agar sama dengan PRD (bukan Google Maps).</p>
    </section>
    <section class="card">
      <h3>Orders</h3>
      <div id="orders"></div>
    </section>
    <section class="card">
      <h3>Outlets & tagihan</h3>
      <div id="merchants"></div>
    </section>
    <section class="card">
      <h3>Output API terakhir</h3>
      <pre id="out">-</pre>
    </section>
  </main>
  <script>
    const API = "";
    let token = localStorage.getItem("token") || "";
    let me = null;

    const accounts = [
      ["Admin", "admin@local.test"],
      ["Andi (customer)", "andi@local.test"],
      ["Warung A", "outlet-a@local.test"],
      ["Warung B", "outlet-b@local.test"],
      ["Budi (kurir)", "budi@local.test"],
    ];

    document.getElementById("logins").innerHTML = accounts.map(([label, email]) =>
      `<button onclick="login('${email}')">${label}</button>`
    ).join("");

    function rupiah(n) {
      return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(n || 0);
    }

    async function req(path, options = {}) {
      const res = await fetch(API + path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(token ? { Authorization: "Bearer " + token } : {}),
          ...(options.headers || {}),
        },
      });
      const data = await res.json().catch(() => ({}));
      document.getElementById("out").textContent = JSON.stringify(data, null, 2);
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    async function login(email) {
      const data = await req("/api/auth/login", {
        method: "POST",
        body: JSON.stringify({ email, password: "password123" }),
      });
      token = data.token;
      me = data.user;
      localStorage.setItem("token", token);
      renderSession();
      await refresh();
    }

    function renderSession() {
      document.getElementById("session").innerHTML = me
        ? `<b>${me.displayName}</b> · ${me.role} · ${me.email}`
        : "Belum login";
    }

    async function refresh() {
      const merchants = await fetch("/api/merchants").then((r) => r.json());
      document.getElementById("merchants").innerHTML = `<table>
        <tr><th>Outlet</th><th>Status</th><th>Outstanding</th></tr>
        ${merchants.map((m) => `<tr><td>${m.name} (${m.id})</td><td>${m.status}</td><td>${rupiah(m.outstandingAmount)}</td></tr>`).join("")}
      </table>`;

      if (!token) return;
      try {
        if (me?.role === "ADMIN") {
          const kpi = await req("/api/admin/dashboard");
          document.getElementById("kpis").innerHTML = [
            ["GMV", rupiah(kpi.gmv)],
            ["Platform fee", rupiah(kpi.platformFee)],
            ["Order", kpi.orderCount],
            ["Selesai", kpi.orderCompleted],
            ["Kurir online", kpi.courierOnline],
            ["Outstanding", rupiah(kpi.outstandingSettlement)],
          ].map(([k, v]) => `<div class="card"><div class="muted">${k}</div><b>${v}</b></div>`).join("");
        }
        const orders = await req("/api/orders");
        document.getElementById("orders").innerHTML = `<table>
          <tr><th>ID</th><th>Status</th><th>Makanan</th><th>Ongkir</th><th>Fee</th><th>Total</th><th>Kurir</th></tr>
          ${orders.map((o) => `<tr>
            <td>${o.id}</td><td>${o.status}</td><td>${rupiah(o.foodSubtotal)}</td>
            <td>${rupiah(o.deliveryFee)}</td><td>${rupiah(o.platformFee)}</td>
            <td>${rupiah(o.grandTotal)}</td><td>${o.courier?.fullName || "-"}</td>
          </tr>`).join("")}
        </table>`;
      } catch (e) {
        console.warn(e);
      }
    }

    async function createSample(type) {
      if (!me || me.role !== "CUSTOMER") await login("andi@local.test");
      const body = type === "multi"
        ? {
            merchantItems: [
              { merchantId: "OUTLET-001", items: [{ menuId: "MENU-A1", qty: 1 }] },
              { merchantId: "OUTLET-002", items: [{ menuId: "MENU-B1", qty: 1 }, { menuId: "MENU-B2", qty: 1 }] },
            ],
            delivery: { address: "Jl. Veteran, Banjarmasin", latitude: -3.3194, longitude: 114.5471 },
            forceBilledKm: 8,
          }
        : {
            merchantItems: [
              { merchantId: "OUTLET-001", items: [{ menuId: "MENU-A1", qty: 1 }, { menuId: "MENU-A2", qty: 1 }] },
            ],
            delivery: { address: "Jl. Veteran, Banjarmasin", latitude: -3.3644, longitude: 114.5921 },
            forceBilledKm: 5,
          };
      await req("/api/orders", { method: "POST", body: JSON.stringify(body) });
      await login("andi@local.test");
    }

    async function latestOrderId() {
      const orders = await req("/api/orders");
      const open = orders.find((o) => o.status !== "COMPLETED" && o.status !== "CANCELLED");
      return (open || orders[0])?.id;
    }

    async function advanceMerchant() {
      const id = await latestOrderId();
      await login("outlet-a@local.test");
      await req(`/api/orders/${id}/merchant-respond`, { method: "POST", body: JSON.stringify({ accept: true }) });
      await req(`/api/orders/${id}/merchant-status`, { method: "POST", body: JSON.stringify({ status: "PREPARING" }) });
      await req(`/api/orders/${id}/merchant-status`, { method: "POST", body: JSON.stringify({ status: "READY" }) });
      try {
        await login("outlet-b@local.test");
        await req(`/api/orders/${id}/merchant-respond`, { method: "POST", body: JSON.stringify({ accept: true }) });
        await req(`/api/orders/${id}/merchant-status`, { method: "POST", body: JSON.stringify({ status: "PREPARING" }) });
        await req(`/api/orders/${id}/merchant-status`, { method: "POST", body: JSON.stringify({ status: "READY" }) });
      } catch {}
      await refresh();
    }

    async function advanceCourier() {
      const id = await latestOrderId();
      await login("budi@local.test");
      await req(`/api/orders/${id}/assign-courier`, { method: "POST", body: "{}" });
      for (const status of ["COURIER_GOING_TO_OUTLET", "PICKED_UP", "DELIVERING", "DELIVERED"]) {
        await req(`/api/orders/${id}/courier-status`, { method: "POST", body: JSON.stringify({ status }) });
      }
      await req(`/api/orders/${id}/complete`, { method: "POST", body: "{}" });
      await refresh();
    }

    async function payBill() {
      await login("outlet-a@local.test");
      await req("/api/settlements", { method: "POST", body: JSON.stringify({ proofUrl: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" }) });
      await refresh();
    }

    async function verifyBill() {
      await login("admin@local.test");
      const rows = await req("/api/settlements");
      const pending = rows.find((r) => r.status === "PENDING");
      if (!pending) throw new Error("Tidak ada settlement pending");
      await req(`/api/settlements/${pending.id}/verify`, { method: "POST", body: JSON.stringify({ approve: true }) });
      await refresh();
    }

    (async () => {
      if (token) {
        try {
          const user = await req("/api/me");
          me = { ...user, displayName: user.displayName, role: user.role, email: user.email };
        } catch {
          token = "";
          localStorage.removeItem("token");
        }
      }
      renderSession();
      if (!token) {
        try { await login("admin@local.test"); } catch (e) { console.warn(e); }
      } else {
        await refresh();
      }
    })();
  </script>
</body>
</html>
