<!DOCTYPE html>
<html class="light" lang="id">
<head>
  <meta charset="utf-8"/>

            "on-tertiary": "#ffffff",

            "primary-fixed": "#DCFCE7",

          spacing: {

          fontFamily: {

            "headline-md": ["22px", { lineHeight: "28px", fontWeight: "700" }],

  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background-color: #f6f7f6; color: #111; }
    html, body, #app { height: 100%; height: 100dvh; margin: 0; }
    #app { overflow: auto; }
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; font-size: 22px; line-height: 1; }
    .pulse-ring {
      border-radius: 9999px;
      aspect-ratio: 1 / 1;
      transform-origin: 50% 50%;
      pointer-events: none;
      animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.55; }
      100% { transform: scale(1.45); opacity: 0; }
    }
    .radar-ping {
      border-radius: 9999px;
      aspect-ratio: 1 / 1;
      transform-origin: 50% 50%;
      pointer-events: none;
      animation: radar-ping 2.4s cubic-bezier(0.15, 0.7, 0.3, 1) infinite;
    }
    @keyframes radar-ping {
      0% { transform: scale(1); opacity: 0.55; }
      100% { transform: scale(3.4); opacity: 0; }
    }
    .leaflet-container { width: 100%; height: 100%; background: #dce6ef; z-index: 0 !important; }
    #job-map { z-index: 0; isolation: isolate; }
    .leaflet-control-zoom, .leaflet-control-attribution { display: none !important; }
    .dk-rider-wrap { background: none !important; border: 0 !important; }
    .dk-rider-spin {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      transform-origin: 50% 70%;
      transition: transform 0.35s linear;
    }
    .dk-rider-bob {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background: #111;
      color: #22C55E;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
      animation: dk-rider-bob 0.55s ease-in-out infinite;
    }
    .dk-rider-bob .material-symbols-outlined {
      font-size: 26px;
      font-variation-settings: "FILL" 1, "wght" 600, "GRAD" 0, "opsz" 24;
    }
    @keyframes dk-rider-bob {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50% { transform: translateY(-4px) rotate(6deg); }
    }
    .map-gradient { background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 100%); }
    .progress-ring { transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 1s linear; }
    .glass-panel { background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

    :root {
      --check-opacity-dur: 500ms;
      --check-rotate-dur: 500ms;
      --check-rotate-from: 80deg;
      --check-bob-dur: 500ms;
      --check-y-amount: 8px;
      --check-blur-dur: 500ms;
      --check-blur-from: 10px;
      --check-path-dur: 500ms;
      --check-path-delay: 80ms;
      --check-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --check-ease-opacity: cubic-bezier(0.22, 1, 0.36, 1);
      --check-ease-rotate: cubic-bezier(0.22, 1, 0.36, 1);
      --check-ease-bob: cubic-bezier(0.34, 1.35, 0.64, 1);
      --check-ease-path: cubic-bezier(0.22, 1, 0.36, 1);
    }
    .pickup-check {
      position: absolute;
      inset: 0;
      z-index: 2;
      margin: 0;
      width: 24px;
      height: 24px;
      opacity: 0;
      cursor: pointer;
    }
    .t-success-check {
      display: inline-block;
      transform-origin: center;
      opacity: 0;
      will-change: transform, opacity, filter;
    }
    .t-success-check svg { display: block; overflow: visible; }
    .t-success-check svg path {
      stroke-dasharray: 28;
      stroke-dashoffset: 28;
    }
    .pickup-check:checked + .t-check-face {
      border-color: #22C55E;
      background: #22C55E;
    }
    .pickup-check:checked + .t-check-face .t-success-check {
      animation:
        t-check-fade var(--check-opacity-dur) var(--check-ease-opacity) forwards,
        t-check-rotate var(--check-rotate-dur) var(--check-ease-rotate) forwards,
        t-check-blur var(--check-blur-dur) var(--check-ease-out) forwards,
        t-check-bob var(--check-bob-dur) var(--check-ease-bob) forwards;
    }
    .pickup-check:checked + .t-check-face .t-success-check svg path {
      animation: t-check-draw var(--check-path-dur) var(--check-ease-path) var(--check-path-delay) forwards;
    }
    .pickup-check:not(:checked) + .t-check-face .t-success-check {
      opacity: 0;
      animation: none;
      filter: none;
      transform: none;
      translate: 0;
    }
    .pickup-check:not(:checked) + .t-check-face .t-success-check svg path {
      animation: none;
      stroke-dashoffset: 28;
    }
    @keyframes t-check-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes t-check-rotate {
      from { transform: rotate(var(--check-rotate-from)); }
      to { transform: rotate(0deg); }
    }
    @keyframes t-check-blur {
      from { filter: blur(var(--check-blur-from)); }
      to { filter: blur(0); }
    }
    @keyframes t-check-bob {
      from { translate: 0 var(--check-y-amount); }
      to { translate: 0 0; }
    }
    @keyframes t-check-draw { to { stroke-dashoffset: 0; } }
    /* Full-screen SUCCESS setelah complete tunai */
    .t-success-overlay {
      position: fixed; inset: 0; z-index: 90;
      background: #fff;
      display: flex; flex-direction: column; align-items: center;
      padding: 48px 28px 28px;
      animation: t-success-fadein 280ms ease forwards;
    }
    @keyframes t-success-fadein { from { opacity: 0; } to { opacity: 1; } }
    .t-success-overlay .t-success-check {
      width: 132px; height: 132px;
    }
    .t-success-overlay .t-success-check[data-state="in"] {
      animation:
        t-check-fade var(--check-opacity-dur) var(--check-ease-opacity) forwards,
        t-check-rotate var(--check-rotate-dur) var(--check-ease-rotate) forwards,
        t-check-blur var(--check-blur-dur) var(--check-ease-out) forwards,
        t-check-bob var(--check-bob-dur) var(--check-ease-bob) forwards;
    }
    .t-success-overlay .t-success-check[data-state="in"] svg path {
      stroke-dasharray: 120;
      stroke-dashoffset: 120;
      animation: t-check-draw-lg var(--check-path-dur) var(--check-ease-path) var(--check-path-delay) forwards;
    }
    @keyframes t-check-draw-lg { to { stroke-dashoffset: 0; } }
    .t-success-overlay h1 {
      margin-top: 28px;
      font-size: 28px; font-weight: 800; letter-spacing: 1.2px;
      color: #1F2937; text-align: center;
    }
    .t-success-overlay p.msg {
      margin-top: 12px; max-width: 320px;
      font-size: 15px; line-height: 1.45; font-weight: 500;
      color: #9CA3AF; text-align: center;
    }
    .t-success-overlay .amt {
      margin-top: 18px; font-size: 20px; font-weight: 800; color: #16A34A;
    }
    .t-success-overlay .done-btn {
      margin-top: auto; width: 100%; max-width: 420px; height: 54px;
      border: 0; border-radius: 14px; background: #16A34A; color: #fff;
      font-weight: 800; font-size: 16px; letter-spacing: 1.1px; cursor: pointer;
    }
    .glass-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
    .hide-scrollbar::-webkit-scrollbar, .no-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar, .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes chat-badge-pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    #chat-badge:not(.hidden) { animation: chat-badge-pop 1.4s ease-in-out infinite; }
    .dk-online-dot {
      position: relative;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22C55E;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55);
      animation: dk-online-dot 1.6s ease-out infinite;
    }
    .dk-online-dot::after {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 999px;
      border: 2px solid rgba(34, 197, 94, 0.7);
      animation: dk-online-ring 1.6s ease-out infinite;
    }
    .dk-online-chip {
      animation: dk-online-chip 2.4s ease-in-out infinite;
    }
    @keyframes dk-online-dot {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
      70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    @keyframes dk-online-ring {
      0% { transform: scale(0.55); opacity: 0.9; }
      100% { transform: scale(1.7); opacity: 0; }
    }
    @keyframes dk-online-chip {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
      50% { box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.16); }
    }
    .input-group { position: relative; }
    .input-field {
      width: 100%; height: 56px; padding: 20px 48px 8px 16px; border-radius: 12px;
      border: 1px solid #727784; background: #fff; font-family: inherit; font-size: 16px; color: #1d1b18; outline: none;
    }
    .input-field:focus { border-color: #22C55E; box-shadow: 0 0 0 1px #22C55E; }
    .input-label {
      position: absolute; left: 16px; top: 18px; font-size: 16px; color: #6B7280; pointer-events: none; transition: all 0.2s ease-out;
    }
    .input-field:focus ~ .input-label, .input-field:not(:placeholder-shown) ~ .input-label {
      top: 8px; font-size: 12px; color: #22C55E; font-weight: 600;
    }
    .dk-nav {
      position: fixed; left: 50%; bottom: 22px; z-index: 50; width: min(84vw, 380px);
      transform: translateX(-50%);
      box-sizing: border-box;
      transition: opacity .28s ease, transform .28s cubic-bezier(.22,1,.36,1);
    }
    #nav-root.is-off .dk-nav {
      opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(16px);
    }
    .dk-nav-bar {
      position: relative; height: 72px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      box-shadow:
        0 10px 32px rgba(0, 0, 0, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.72);
      display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; padding: 0 8px;
      overflow: hidden; box-sizing: border-box;
    }
    .dk-nav-thumb {
      position: absolute; top: 10px; left: 8px; width: calc((100% - 16px) / 4); height: 52px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.16);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
      pointer-events: none;
      transition: transform .42s cubic-bezier(.22,1,.36,1); box-sizing: border-box;
      will-change: transform;
    }
    .dk-nav-item {
      position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
      height: 52px; color: rgba(17, 17, 17, 0.42); border-radius: 999px;
      transition: color .28s ease;
    }
    .dk-nav-item.is-on { color: #16A34A; }
    .dk-nav-item .material-symbols-outlined {
      display: block;
      width: 24px;
      height: 24px;
      font-size: 24px;
      transition: transform .28s cubic-bezier(.22,1,.36,1);
    }
    .dk-nav-item.is-on .material-symbols-outlined { transform: scale(1.12); }
    .dk-nav-item::after {
      content: ""; position: absolute; bottom: 6px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px;
      border-radius: 999px; background: #22C55E;
      opacity: 0; transform: scale(.5);
      transition: opacity .28s ease, transform .28s cubic-bezier(.22,1,.36,1);
    }
    .dk-nav-item.is-on::after { opacity: 1; transform: scale(1); }
    .input-field:not(:placeholder-shown):not(:focus) ~ .input-label { color: #424752; }
    #app > * { animation: pageFade .22s ease both; }
    @keyframes pageFade { from { opacity: .35; } to { opacity: 1; } }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(.86); }
      70% { transform: scale(1.06); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50% { transform: translateY(-10px) rotate(4deg); }
    }
    @keyframes floatY2 {
      0%, 100% { transform: translateY(0) rotate(8deg); }
      50% { transform: translateY(-8px) rotate(-4deg); }
    }
    @keyframes scooter {
      0%, 100% { transform: translate(0, 0) rotate(-8deg); }
      50% { transform: translate(-8px, -12px) rotate(4deg); }
    }
    @keyframes shimmer {
      0% { background-position: -40% 0; }
      100% { background-position: 140% 0; }
    }
    @keyframes pulseSoft {
      0%, 100% { box-shadow: 0 8px 24px rgba(34,197,94,.28); }
      50% { box-shadow: 0 12px 32px rgba(34,197,94,.45); }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
    }
    @keyframes blob {
      0%, 100% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.12) translate(8px, -6px); }
    }
    .anim-up { animation: fadeUp .55s cubic-bezier(.22,1,.36,1) both; }
    .anim-pop { animation: popIn .45s cubic-bezier(.22,1,.36,1) both; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .1s; } .d3 { animation-delay: .16s; }
    .d4 { animation-delay: .22s; } .d5 { animation-delay: .28s; } .d6 { animation-delay: .34s; }
    .press { transition: transform .16s ease, box-shadow .16s ease; }
    .press:active { transform: scale(.92); }
    .icon-bounce:hover .material-symbols-outlined { animation: wiggle .45s ease; }
    .card-lift { transition: transform .25s ease, box-shadow .25s ease; }
    .card-lift:hover, .card-lift:active { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,.08); }
    .hero-shimmer {
      background: linear-gradient(110deg, #22C55E 0%, #4ADE80 35%, #16A34A 50%, #22C55E 70%);
      background-size: 220% 100%;
      animation: shimmer 4.5s ease-in-out infinite, pulseSoft 2.8s ease-in-out infinite;
    }
    .blob { position: absolute; border-radius: 999px; filter: blur(2px); animation: blob 5s ease-in-out infinite; }
    .login-page {
      background:
        radial-gradient(90% 70% at 78% 8%, #DBEAFE 0%, transparent 58%),
        radial-gradient(80% 55% at 8% 92%, #DCFCE7 0%, transparent 52%),
        radial-gradient(45% 35% at 92% 78%, #FEF9C3 0%, transparent 50%),
        #FFFFFF;
    }
    .login-hero {
      position: relative;
      height: 300px;
      display: grid;
      place-items: center;
      background: transparent;
      box-shadow: none;
      overflow: visible;
    }
    .login-hero img {
      width: auto;
      max-width: 94%;
      height: 280px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      animation: loginRide 3.6s ease-in-out infinite;
    }
    @keyframes loginRide {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(8px, -10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .anim-up, .anim-pop, .hero-shimmer, .blob, #chat-badge:not(.hidden), .pulse-ring, .radar-ping, .dk-online-dot, .dk-online-dot::after, .dk-online-chip, #app > *, .t-success-check, .t-success-check svg path, .dk-rider-bob, .t-success-overlay, .login-hero img { animation: none !important; }
      .t-success-check { opacity: 1; }
      .pickup-check:checked + .t-check-face .t-success-check svg path,
      .t-success-overlay .t-success-check svg path { stroke-dashoffset: 0 !important; }
      .dk-nav-thumb { transition: none; }
    }

    /* Boot splash — hijau polos, logo hitam, kredit Brynx */
    #dk-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: grid; place-items: center;
      background: #22C55E;
      color: #fff; padding: 28px 32px 36px;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #dk-splash.is-leave { opacity: 0; visibility: hidden; pointer-events: none; }
    #dk-splash .dk-splash-mark {
      background: transparent; border: 0; padding: 0; box-shadow: none;
      margin-top: -8vh;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      animation: dk-splash-rise 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    #dk-splash .dk-splash-mark img {
      height: 72px; width: auto; max-width: min(360px, 78vw); display: block;
    }
    #dk-splash .dk-splash-line {
      margin: 0; font-size: 16px; font-weight: 800;
      letter-spacing: -0.02em; text-align: center;
      background: linear-gradient(90deg, #fff 0%, #a7f3d0 20%, #34d399 40%, #fff 60%, #6ee7b7 80%, #fff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: dk-orbit 2.8s linear infinite;
    }
    #dk-splash .dk-splash-credit {
      position: absolute; left: 0; right: 0; bottom: 36px;
      margin: 0; text-align: center;
      font-size: 15px; font-weight: 700; letter-spacing: -0.02em; color: #fff;
    }
    @keyframes dk-splash-rise {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes dk-orbit {
      0%   { background-position: 200% center; }
      100% { background-position: -200% center; }
    }
  </style>
</head>
<body class="min-h-screen bg-surface font-body-md text-on-background antialiased">
  <div id="dk-splash" aria-live="polite" aria-busy="true">
    <div class="dk-splash-mark">
      <img src="/logo-antarq-black.png" alt="ANTARQ"/>
      <p class="dk-splash-line">Siap antar, siap dapat ongkir</p>
    </div>
    <p class="dk-splash-credit">from Brynx Solution company</p>
  </div>
  <div id="app"></div>
  <div id="nav-root" class="is-off"></div>
  <div id="success-root"></div>
  <script>
    function paintStandaloneLogin(msg) {
      loginErr = msg || "";
      authView = "login";
      bindAuthPages();
    }
    let token = "";
    let user = null;
    try {
      token = localStorage.getItem("dk_courier_token") || "";
      user = JSON.parse(localStorage.getItem("dk_courier_user") || "null");
    } catch (_) {
      token = "";
      user = null;
    }
    function avatarHtml(name, size) {
      const cls = size === "lg"
        ? "w-20 h-20 text-2xl border-2 border-primary"
        : "w-10 h-10 text-sm border-2 border-primary";
      return `<div class="${cls} rounded-full overflow-hidden bg-primary-fixed text-primary font-bold grid place-items-center shrink-0">${esc(initials(name))}</div>`;
    }
    let profile = null;
    let watchId = null;
    let lastGps = null;
    let jobNav = null;
    let mapsKey = "";
    let pollTimer = null;
    let offerTimer = null;
    let chatTimer = null;
    let routeGen = 0;
    let lastProfileAt = 0;
    let lastHomeSig = "";
    let lastGpsPostAt = 0;
    let showPass = false;
    let loginErr = "";
    let authView = "login";
    let ktpDataUrl = "";
    let ktpDraft = {
      nik: "",
      fullName: "",
      placeOfBirth: "",
      dateOfBirth: "",
      address: "",
      fullNameFromOcr: "",
      ocrConfidence: 0,
    };
    let ktpOcrLoading = false;
    let ktpOcrNote = "";
    let ktpMismatches = [];
    let pendingMsg = "";
    let draftReg = { fullName: "", phone: "", email: "", password: "" };
    let editingCourierProfile = false;
    let showCourierLocationPanel = false;
    let showCourierPriorityPanel = false;
    let helpError = "";
    let helpMessage = "";
    let helpBusy = false;
    let courierProfileError = "";

    function icon(name, cls, fill) {
      return `<span class="material-symbols-outlined ${cls || ""}" style="font-variation-settings:'FILL' ${fill ? 1 : 0}">${name}</span>`;
    }
    function rupiah(n) {
      return "Rp" + Number(n || 0).toLocaleString("id-ID");
    }
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function go(hash) {
      const next = hash.startsWith("#") ? hash : "#" + hash;
      if ((location.hash || "") !== next) location.hash = next;
      return route();
    }

    function showSuccessOverlay({ title, message, amountLabel, onDone }) {
      const root = document.getElementById("success-root");
      if (!root) {
        onDone?.();
        return;
      }
      root.innerHTML = `
        <div class="t-success-overlay" role="dialog" aria-label="${esc(title || "Berhasil")}">
          <span class="t-success-check" data-state="out" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" width="132" height="132">
              <path d="M24 6a18 18 0 1 1 0 36 18 18 0 0 1 0-36Z" stroke="#16A34A" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M15 24.5 21.5 31 33.5 17" stroke="#16A34A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <h1>${esc(title || "BERHASIL!")}</h1>
          <p class="msg">${esc(message || "")}</p>
          ${amountLabel ? `<div class="amt">${esc(amountLabel)}</div>` : ""}
          <button type="button" class="done-btn press" id="success-done">SELESAI</button>
        </div>`;
      const mark = root.querySelector(".t-success-check");
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (mark) mark.setAttribute("data-state", "in");
        });
      });
      try { navigator.vibrate?.([18, 40, 28]); } catch (_) {}
      document.getElementById("success-done")?.addEventListener("click", () => {
        root.innerHTML = "";
        onDone?.();
      });
    }
    async function api(path, options = {}) {
      const ctrl = new AbortController();
      const timeoutMs = Number(options.timeoutMs) || 7000;
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      const { timeoutMs: _ignored, ...fetchOpts } = options;
      try {
        const res = await fetch(path, {
          ...fetchOpts,
          signal: ctrl.signal,
          headers: {
            "Content-Type": "application/json",
            ...(token ? { Authorization: "Bearer " + token } : {}),
            ...(fetchOpts.headers || {}),
          },
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Request gagal");
        return data;
      } catch (err) {
        if (err && err.name === "AbortError") throw new Error("Server lambat atau tidak merespons");
        throw err;
      } finally {
        clearTimeout(timer);
      }
    }
    function merchantName(order) {
      return order.merchants?.[0]?.merchant?.name || "Warung";
    }
    function merchantAddr(order) {
      return order.merchants?.[0]?.merchant?.address || "";
    }
    function customerName(order) {
      return order.customer?.fullName || "Pelanggan";
    }
    function items(order) {
      return order.items || [];
    }
    function qty(order) {
      return items(order).reduce((s, i) => s + Number(i.qty || 0), 0);
    }
    function initials(name) {
      const parts = String(name || "P").trim().split(/\s+/).filter(Boolean);
      return ((parts[0]?.[0] || "P") + (parts[1]?.[0] || "")).toUpperCase();
    }
    function formatChatTime(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      return d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
    }
    function chatReadKey(orderId, role) {
      return "dk_chat_read_" + role + "_" + orderId;
    }
    function unreadChatCount(messages, meRole, orderId) {
      const last = localStorage.getItem(chatReadKey(orderId, meRole)) || "";
      const list = messages || [];
      if (!last) return list.filter((m) => m.senderRole !== meRole).length;
      const idx = list.findIndex((m) => m.id === last);
      if (idx < 0) return list.filter((m) => m.senderRole !== meRole).length;
      return list.slice(idx + 1).filter((m) => m.senderRole !== meRole).length;
    }
    function markChatRead(orderId, meRole, messages) {
      const last = (messages || [])[(messages || []).length - 1];
      if (last?.id) localStorage.setItem(chatReadKey(orderId, meRole), last.id);
    }
    function paintChatBadge(n) {
      const btn = document.getElementById("open-chat");
      const badge = document.getElementById("chat-badge");
      const label = document.getElementById("chat-label");
      if (!btn || !badge) return;
      if (n > 0) {
        badge.textContent = n > 9 ? "9+" : String(n);
        badge.classList.remove("hidden");
        if (label) label.textContent = "Pesan baru";
        btn.setAttribute("aria-label", "Chat, " + n + " pesan baru");
      } else {
        badge.classList.add("hidden");
        if (label) label.textContent = "Chat";
        btn.setAttribute("aria-label", "Chat");
      }
    }
    function chatOverlayHtml(peerName) {
      const initial = String(peerName || "P").trim().charAt(0).toUpperCase();
      return `
        <div id="order-chat" class="hidden absolute inset-0 z-[80] bg-[#F7F7F7] flex flex-col">
          <header class="h-[64px] px-2 flex items-center gap-2 bg-[#EFEFEF] shrink-0">
            <button type="button" id="chat-close" class="w-10 h-10 rounded-full grid place-items-center shrink-0 text-[#111]">${icon("arrow_back")}</button>
            <div class="w-10 h-10 rounded-full bg-primary-fixed text-primary font-bold grid place-items-center shrink-0">${esc(initial)}</div>
            <div class="min-w-0 flex-1">
              <p class="font-bold truncate leading-tight text-[16px] text-[#111]">${esc(peerName || "Pelanggan")}</p>
              <p class="text-[12px] text-[#8E8E93] leading-tight">Online</p>
            </div>
          </header>
          <div id="chat-list" class="flex-1 overflow-y-auto px-4 py-3 space-y-3 bg-[#F7F7F7]"></div>
          <div id="chat-chips" class="hidden px-3 pt-2 pb-1 gap-2 overflow-x-auto hide-scrollbar shrink-0 bg-white"></div>
          <form id="chat-form" class="px-3 py-2.5 flex items-center gap-2 bg-white shrink-0">
            <button type="button" id="chat-plus" class="w-10 h-10 rounded-full grid place-items-center text-[#8E8E93] shrink-0" aria-label="Lainnya"><span class="material-symbols-outlined">add</span></button>
            <div class="relative flex-1 min-w-0">
              <input id="chat-input" maxlength="500" autocomplete="off" class="w-full h-11 rounded-[22px] bg-white border border-[#E5E5EA] pl-4 pr-11 text-[15px] outline-none focus:border-primary" placeholder="Pesan"/>
              <button type="submit" id="chat-send" class="hidden absolute right-1 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-primary text-white grid place-items-center" aria-label="Kirim"><span class="material-symbols-outlined text-[20px]">send</span></button>
            </div>
            <button type="button" id="chat-cam" class="w-10 h-10 rounded-full grid place-items-center text-[#8E8E93] shrink-0" aria-label="Kamera"><span class="material-symbols-outlined">photo_camera</span></button>
            <input id="chat-photo" type="file" accept="image/*" capture="environment" class="hidden"/>
          </form>
        </div>`;
    }
    function chatImageSrc(body) {
      const raw = String(body || "").trim();
      if (!raw.startsWith("IMG:")) return null;
      const src = raw.slice(4);
      if (!/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/]+=*$/.test(src)) return null;
      return src;
    }
    function chatBubbleInner(body, mine) {
      const src = chatImageSrc(body);
      if (src) {
        return `<img src="${src}" alt="Foto" class="block max-w-[220px] max-h-[280px] w-auto h-auto rounded-[14px] object-cover"/>`;
      }
      return `<div class="px-3.5 py-2.5 text-[15px] leading-snug whitespace-pre-wrap ${
        mine
          ? "bg-primary text-white rounded-[18px] rounded-br-md"
          : "bg-[#E9E9EB] text-[#111] rounded-[18px] rounded-bl-md"
      }">${esc(body)}</div>`;
    }
    function compressChatImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 720;
          let w = img.width;
          let h = img.height;
          if (w > max || h > max) {
            const scale = Math.min(max / w, max / h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL("image/jpeg", 0.7));
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Gagal baca foto"));
        };
        img.src = url;
      });
    }
    function chatDayLabel(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      const now = new Date();
      if (d.toDateString() === now.toDateString()) return "Hari ini";
      return d.toLocaleDateString("id-ID", { day: "numeric", month: "short" });
    }
    function renderChatMessages(listEl, messages, meRole) {
      if (!listEl) return;
      const atBottom = listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight < 80;
      const list = messages || [];
      if (!list.length) {
        listEl.innerHTML = `<p class="text-center text-sm text-[#8E8E93] pt-10">Belum ada pesan.</p>`;
        return;
      }
      let lastDay = "";
      listEl.innerHTML = list.map((m) => {
        const mine = m.senderRole === meRole;
        const day = chatDayLabel(m.createdAt);
        const dayChip = day && day !== lastDay
          ? `<div class="flex justify-center py-1"><span class="text-[11px] text-[#8E8E93] bg-[#E8E8ED] px-3 py-1 rounded-full">${esc(day)}</span></div>`
          : "";
        lastDay = day;
        return `
          ${dayChip}
          <div class="flex ${mine ? "justify-end" : "justify-start"}">
            <div class="max-w-[78%] flex flex-col ${mine ? "items-end" : "items-start"}">
              ${chatBubbleInner(m.body, mine)}
              <p class="text-[11px] text-[#8E8E93] mt-1 px-1">${esc(formatChatTime(m.createdAt))}</p>
            </div>
          </div>`;
      }).join("");
      if (atBottom || !messages?.length) listEl.scrollTop = listEl.scrollHeight;
    }
    function bindOrderChat(order, meRole, peerName, chips) {
      const overlay = document.getElementById("order-chat");
      const listEl = document.getElementById("chat-list");
      const form = document.getElementById("chat-form");
      const input = document.getElementById("chat-input");
      const chipsEl = document.getElementById("chat-chips");
      if (!overlay || !form || !input) return;
      if (chipsEl) {
        chipsEl.innerHTML = (chips || []).map((t) =>
          `<button type="button" data-chip="${esc(t)}" class="shrink-0 h-8 px-3 rounded-full bg-[#f6f3f5] text-[12px] font-semibold">${esc(t)}</button>`
        ).join("");
      }
      let me = meRole;
      const chatOpen = () => !overlay.classList.contains("hidden");
      const refreshChat = async () => {
        try {
          const data = await api("/api/orders/" + encodeURIComponent(order.id) + "/chat");
          me = data.me || meRole;
          if (chatOpen()) {
            renderChatMessages(listEl, data.messages, me);
            markChatRead(order.id, me, data.messages);
            paintChatBadge(0);
          } else {
            paintChatBadge(unreadChatCount(data.messages, me, order.id));
          }
        } catch (_) {}
      };
      const openChat = () => {
        overlay.classList.remove("hidden");
        refreshChat();
        setTimeout(() => input.focus(), 50);
      };
      const openBtn = document.getElementById("open-chat");
      if (openBtn) openBtn.onclick = openChat;
      if (!overlay.dataset.bound) {
        overlay.dataset.bound = "1";
        const syncComposer = () => {
          const has = String(input.value || "").trim().length > 0;
          document.getElementById("chat-send")?.classList.toggle("hidden", !has);
        };
        input.addEventListener("input", syncComposer);
        document.getElementById("chat-close")?.addEventListener("click", () => {
          overlay.classList.add("hidden");
          refreshChat();
        });
        document.getElementById("chat-plus")?.addEventListener("click", (e) => {
          e.preventDefault();
          if (!chipsEl) return;
          const show = chipsEl.classList.contains("hidden");
          chipsEl.classList.toggle("hidden", !show);
          chipsEl.classList.toggle("flex", show);
        });
        const photoInput = document.getElementById("chat-photo");
        document.getElementById("chat-cam")?.addEventListener("click", () => photoInput?.click());
        photoInput?.addEventListener("change", async () => {
          const file = photoInput.files && photoInput.files[0];
          photoInput.value = "";
          if (!file) return;
          if (!String(file.type || "").startsWith("image/")) {
            alert("Pilih foto.");
            return;
          }
          try {
            const dataUrl = await compressChatImage(file);
            await api("/api/orders/" + encodeURIComponent(order.id) + "/chat", {
              method: "POST",
              body: JSON.stringify({ body: "IMG:" + dataUrl }),
            });
            await refreshChat();
          } catch (err) {
            alert(err.message || "Gagal kirim foto");
          }
        });
        chipsEl?.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-chip]");
          if (!btn) return;
          input.value = btn.getAttribute("data-chip") || "";
          input.dispatchEvent(new Event("input"));
          input.focus();
        });
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const body = String(input.value || "").trim();
          if (!body) return;
          input.value = "";
          input.dispatchEvent(new Event("input"));
          try {
            await api("/api/orders/" + encodeURIComponent(order.id) + "/chat", {
              method: "POST",
              body: JSON.stringify({ body }),
            });
            await refreshChat();
          } catch (err) {
            alert(err.message || "Gagal kirim pesan");
          }
        });
      }
      refreshChat();
      if (chatTimer) clearInterval(chatTimer);
      chatTimer = setInterval(refreshChat, 2500);
    }
    function isActive(s) {
      return !["COMPLETED", "CANCELLED"].includes(s);
    }
    function goingOutlet(s) {
      return [
        "OUTLET_ACCEPTED",
        "PREPARING",
        "READY_FOR_PICKUP",
        "COURIER_ASSIGNED",
        "COURIER_GOING_TO_OUTLET",
      ].includes(s);
    }
    function foodReady(order) {
      const live = (order.merchants || []).filter((m) => m.status !== "REJECTED");
      return live.length > 0 && live.every((m) => m.status === "READY" || m.status === "COMPLETED");
    }

    function paintNav(active) {
      const itemsNav = [
        ["#/home", "home", "Beranda"],
        ["#/orders", "list_alt", "Order"],
        ["#/earnings", "payments", "Pendapatan"],
        ["#/account", "person", "Akun"],
      ];
      const root = document.getElementById("nav-root");
      if (!root) return;
      if (!root.querySelector(".dk-nav")) {
        root.innerHTML = `
          <nav class="dk-nav" aria-label="Menu utama">
            <div class="dk-nav-bar">
              <span class="dk-nav-thumb"></span>
              ${itemsNav.map(([href, ic, label]) => `
                <a href="${href}" aria-label="${label}" class="dk-nav-item">${icon(ic, "", false)}</a>`).join("")}
            </div>
          </nav>`;
      }
      const idx = itemsNav.findIndex(([href]) => href === active);
      const show = idx >= 0;
      root.classList.toggle("is-off", !show);
      const thumb = root.querySelector(".dk-nav-thumb");
      if (thumb && show) thumb.style.transform = "translateX(" + idx * 100 + "%)";
      root.querySelectorAll(".dk-nav-item").forEach((a, i) => {
        const on = show && i === idx;
        a.classList.toggle("is-on", on);
        const ic = a.querySelector(".material-symbols-outlined");
        if (ic) ic.style.fontVariationSettings = "'FILL' " + (on ? 1 : 0);
      });
    }

    function formatPriorityCountdown(untilIso) {
      if (!untilIso) return "";
      const left = new Date(untilIso).getTime() - Date.now();
      if (!Number.isFinite(left) || left <= 0) return "";
      const totalSec = Math.floor(left / 1000);
      const d = Math.floor(totalSec / 86400);
      const h = Math.floor((totalSec % 86400) / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      const mm = String(m).padStart(2, "0");
      const ss = String(s).padStart(2, "0");
      const tail = mm + "m " + ss + "s";
      if (d > 0) return d + "h " + h + "j " + tail;
      if (h > 0) return h + "j " + tail;
      return tail;
    }

    let priorityTickTimer = null;
    function stopPriorityTick() {
      if (priorityTickTimer) {
        clearInterval(priorityTickTimer);
        priorityTickTimer = null;
      }
    }
    function startPriorityTick() {
      stopPriorityTick();
      const tick = () => {
        const chip = document.getElementById("priority-chip");
        const cd = document.getElementById("priority-countdown");
        const until = profile?.priorityUntil || chip?.getAttribute("data-until");
        if (!until || !isPriorityStillActive(until)) {
          stopPriorityTick();
          if (profile) {
            profile.priorityActive = false;
            profile.priorityUntil = null;
          }
          if (chip) chip.remove();
          return;
        }
        if (cd) cd.textContent = formatPriorityCountdown(until);
      };
      tick();
      priorityTickTimer = setInterval(tick, 1000);
    }
    function isPriorityStillActive(untilIso) {
      if (!untilIso) return false;
      const t = new Date(untilIso).getTime();
      return Number.isFinite(t) && t > Date.now();
    }

    function headerBar(online) {
      const name = profile?.fullName || user?.displayName || "Kurir";
      const hour = new Date().getHours();
      const hail = hour < 11 ? "Selamat pagi" : hour < 15 ? "Selamat siang" : hour < 18 ? "Selamat sore" : "Selamat malam";
      const until = profile?.priorityUntil || null;
      const priorityOn = !!profile?.priorityActive && isPriorityStillActive(until);
      if (profile && profile.priorityActive && !priorityOn) {
        profile.priorityActive = false;
      }
      const cd = priorityOn ? formatPriorityCountdown(until) : "";
      const priorityChip = priorityOn
        ? `<span id="priority-chip" data-until="${esc(until)}" class="shrink-0 min-h-8 px-2 py-1 rounded-full text-[11px] font-bold inline-flex items-center gap-1 bg-amber-100 text-amber-800 border border-amber-200/80 tabular-nums" title="Prioritas aktif sampai ${esc(new Date(until).toLocaleString("id-ID"))}">
            <span class="material-symbols-outlined text-[15px] shrink-0" style="font-variation-settings:'FILL' 1">workspace_premium</span>
            <span id="priority-countdown" class="whitespace-nowrap">${cd}</span>
          </span>`
        : "";
      // Jadwalkan tick setelah DOM terpasang
      setTimeout(() => (priorityOn ? startPriorityTick() : stopPriorityTick()), 0);
      return `
        <header class="sticky top-0 z-40 bg-[#f6f7f6]/90 backdrop-blur-md px-4 pt-4 pb-3">
          <div class="max-w-lg mx-auto flex items-center justify-between gap-3">
            <div class="min-w-0">
              <p class="text-[12px] text-secondary">${hail}</p>
              <p class="font-bold text-[20px] leading-tight truncate">${esc(name)}</p>
            </div>
            <div class="shrink-0 flex items-center gap-2">
              ${priorityChip}
              <span class="h-8 px-3 rounded-full text-[12px] font-bold inline-flex items-center gap-1.5 ${online ? "bg-primary-fixed text-primary dk-online-chip" : "bg-[#E5E7EB] text-secondary"}">
                <span class="${online ? "dk-online-dot" : "w-2 h-2 rounded-full bg-secondary"}"></span>
                ${online ? "Online" : "Istirahat"}
              </span>
            </div>
          </div>
        </header>`;
    }

    function floatField(name, type, value, label, extra, required = true) {
      return `
        <div class="input-group">
          <input name="${name}" id="${name === "password" ? "pw" : name}" type="${type}" value="${esc(value)}" placeholder=" " ${required ? "required" : ""} class="input-field ${extra || ""}" autocomplete="${name === "password" ? "current-password" : name === "email" ? "email" : "on"}"/>
          <label class="input-label" for="${name === "password" ? "pw" : name}">${label}</label>
        </div>`;
    }

    function ktpVerifyBlock() {
      if (!ktpDataUrl && !ktpOcrLoading) return "";
      const mismatchName = ktpMismatches.includes("fullName");
      const mismatchNik = ktpMismatches.includes("nik");
      return `
        <div class="rounded-xl border border-outline bg-surface-container-low p-sm flex flex-col gap-md">
          <div>
            <p class="font-headline-sm text-headline-sm">Verifikasi data KTP</p>
            <p class="font-body-md text-body-md text-on-surface-variant mt-1">Sistem membaca NIK dan biodata dari foto. Periksa lalu koreksi jika ada yang tidak cocok.</p>
          </div>
          ${ktpOcrLoading ? `<p class="font-body-md text-primary">Membaca foto KTP…</p>` : ""}
          ${ktpOcrNote ? `<p class="font-body-md ${ktpMismatches.length ? "text-warning" : "text-on-surface-variant"}">${esc(ktpOcrNote)}</p>` : ""}
          ${ktpMismatches.length ? `<p class="font-body-md text-error">Ada data tidak cocok — sesuaikan sebelum kirim.</p>` : ""}

    function pageEarnings(mine) {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const week = new Date(Date.now() - 7 * 86400000);
      const completed = (mine || []).filter((o) => o.status === "COMPLETED");
      const todayRows = completed.filter((o) => new Date(o.completedAt || o.createdAt) >= today);
      const weekSum = completed.filter((o) => new Date(o.completedAt || o.createdAt) >= week).reduce((s, o) => s + (o.courierEarning || 0), 0);
      return `
        <div class="bg-[#f6f7f6] min-h-screen flex flex-col pb-24">
          <main class="p-margin-mobile flex flex-col gap-lg max-w-lg mx-auto w-full">

              <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-primary-fixed-dim rounded-full blur-2xl opacity-30"></div>

                <span class="font-body-md text-on-surface-variant">Minggu ini</span>
                <span class="font-currency-bold text-currency-bold text-on-surface">${rupiah(weekSum)}</span>
              </div>
              <div class="relative z-10 flex items-start gap-xs p-sm rounded-lg border border-tertiary-fixed-dim/30" style="background:rgba(0,131,118,0.08)">
                ${icon("info", "text-tertiary text-sm")}
                <p class="font-body-md text-body-md text-on-surface-variant">Pendapatan kurir = ongkir. Komisi makanan bukan milik kurir.</p>
              </div>
            </section>
            <section class="flex flex-col gap-md">
              <h3 class="font-headline-sm text-headline-sm text-on-surface">Riwayat Ongkir Hari Ini</h3>

                    <div class="flex items-center gap-sm">

    function settingRow(opts) {
      const trailing = opts.toggle
        ? `<span class="text-xs font-semibold ${opts.toggleOn ? "text-primary" : "text-secondary"} mr-1">${opts.toggleOn ? "Online" : "Offline"}</span><span class="relative inline-block w-14 h-7 rounded-full shrink-0 ${opts.toggleOn ? "bg-primary" : "bg-[#E5E7EB]"}" aria-hidden="true"><span class="absolute top-0.5 w-6 h-6 bg-white rounded-full shadow ${opts.toggleOn ? "right-0.5" : "left-0.5"}"></span></span>`
        : `${opts.hint ? `<span class="text-xs text-secondary max-w-[42%] truncate text-right">${esc(opts.hint)}</span>` : ""}${icon("chevron_right", "text-[#c5c5c5] text-[22px]")}`;
      const inner = `
        <span class="w-10 h-10 rounded-xl grid place-items-center ${opts.tone || "bg-[#F3F4F6] text-on-surface"} shrink-0">${icon(opts.icon, "text-[22px]", true)}</span>
        <span class="flex-1 font-semibold text-[15px] text-on-surface text-left">${esc(opts.label)}</span>
        ${trailing}`;
      const cls = "press flex items-center gap-3 px-4 min-h-[56px] active:bg-[#F3F4F6] w-full text-left";
      if (opts.href) return `<a href="${opts.href}" class="${cls}">${inner}</a>`;
      return `<button type="button" id="${opts.id}" class="${cls}"${opts.toggle ? ` aria-pressed="${opts.toggleOn ? "true" : "false"}"` : ""}>${inner}</button>`;
    }

    async function fetchRoadRoute(fromLat, fromLng, toLat, toLng) {
      const url =
        "https://router.project-osrm.org/route/v1/driving/" +
        fromLng + "," + fromLat + ";" + toLng + "," + toLat +
        "?overview=full&geometries=geojson";
      const res = await fetch(url);
      const data = await res.json();
      const coords = data?.routes?.[0]?.geometry?.coordinates;
      if (!Array.isArray(coords) || coords.length < 2) return null;
      return coords.map((c) => [c[1], c[0]]);
    }

    function bearingDeg(a, b) {
      const lat1 = (a[0] * Math.PI) / 180;
      const lat2 = (b[0] * Math.PI) / 180;
      const dLng = ((b[1] - a[1]) * Math.PI) / 180;
      const y = Math.sin(dLng) * Math.cos(lat2);
      const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
      return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
    }

    function nearestRouteIndex(latlngs, lat, lng) {
      let best = 0;
      let bestD = Infinity;
      for (let i = 0; i < latlngs.length; i++) {
        const dLat = latlngs[i][0] - lat;
        const dLng = latlngs[i][1] - lng;
        const d = dLat * dLat + dLng * dLng;
        if (d < bestD) {
          bestD = d;
          best = i;
        }
      }
      return best;
    }

    function lerpLatLng(a, b, t) {
      return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
    }

    function riderIcon(heading) {
      const rot = (heading || 0) - 90;
      return L.divIcon({
        className: "dk-rider-wrap",
        iconSize: [52, 52],
        iconAnchor: [26, 34],
        html:
          '<div class="dk-rider-spin" style="transform:rotate(' +
          rot +
          'deg)"><div class="dk-rider-bob">' +
          icon("two_wheeler", "", true) +
          "</div></div>",
      });
    }

    function stopJobNav() {
      if (jobNav?.raf) cancelAnimationFrame(jobNav.raf);
      jobNav = null;
    }

    function setRiderPose(latlng, heading) {
      if (!jobNav?.rider) return;
      jobNav.display = latlng;
      jobNav.heading = heading;
      jobNav.rider.setLatLng(latlng);
      jobNav.rider.setIcon(riderIcon(heading));
    }

    function updateJobRider(lat, lng, heading) {
      if (!jobNav?.route?.length) return;
      jobNav.gotGps = true;
      const i = nearestRouteIndex(jobNav.route, lat, lng);
      const snapped = jobNav.route[i];
      jobNav.target = snapped;
      jobNav.targetIndex = i;
      if (heading == null || Number.isNaN(Number(heading))) {
        const prev = jobNav.route[Math.max(0, i - 1)];
        jobNav.targetHeading = bearingDeg(prev, snapped);
      } else {
        jobNav.targetHeading = Number(heading);
      }
    }

    function tickJobNav(ts) {
      if (!jobNav) return;
      const dt = jobNav.lastTs ? Math.min(0.08, (ts - jobNav.lastTs) / 1000) : 0.016;
      jobNav.lastTs = ts;

      if (!jobNav.gotGps && jobNav.route.length > 1) {
        jobNav.sim += dt * 18;
        const pts = jobNav.route;
        let dist = jobNav.sim;
        let idx = 0;
        while (idx < pts.length - 1) {
          const dLat = pts[idx + 1][0] - pts[idx][0];
          const dLng = pts[idx + 1][1] - pts[idx][1];
          const step = Math.sqrt(dLat * dLat + dLng * dLng) * 111000;
          if (dist <= step) {
            const t = step ? dist / step : 0;
            jobNav.target = lerpLatLng(pts[idx], pts[idx + 1], t);
            jobNav.targetHeading = bearingDeg(pts[idx], pts[idx + 1]);
            break;
          }
          dist -= step;
          idx += 1;
          if (idx >= pts.length - 1) {
            jobNav.sim = 0;
            jobNav.target = pts[0];
          }
        }
      }

      if (jobNav.target) {
        const cur = jobNav.display || jobNav.target;
        const next = lerpLatLng(cur, jobNav.target, Math.min(1, dt * 4));
        let head = jobNav.heading || 0;
        const want = jobNav.targetHeading || head;
        let diff = ((want - head + 540) % 360) - 180;
        head += diff * Math.min(1, dt * 5);
        setRiderPose(next, head);
        if (jobNav.follow) jobNav.map.panTo(next, { animate: true, duration: 0.4 });
      }
      jobNav.raf = requestAnimationFrame(tickJobNav);
    }

    async function mountMap(elId, lat, lng, from) {
      const el = document.getElementById(elId);
      if (!el || lat == null || lng == null || Number.isNaN(Number(lat))) return;
      stopJobNav();
      try {
        const ok = await loadLeaflet();
        const destLat = Number(lat);
        const destLng = Number(lng);
        const fromLat = from?.lat != null ? Number(from.lat) : Number(lastGps?.lat ?? profile?.lastLatitude ?? destLat);
        const fromLng = from?.lng != null ? Number(from.lng) : Number(lastGps?.lng ?? profile?.lastLongitude ?? destLng);
        if (!ok || !window.L) {
          const bbox = [destLng - 0.01, destLat - 0.007, destLng + 0.01, destLat + 0.007].join(",");
          el.innerHTML = `<iframe class="w-full h-full border-0" src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${destLat},${destLng}"></iframe>`;
          return;
        }
        el.innerHTML = "";
        const map = L.map(el, { zoomControl: false }).setView([fromLat, fromLng], 16);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
        map.on("dragstart", () => {
          if (jobNav) jobNav.follow = false;
        });
        L.marker([destLat, destLng]).addTo(map);

        let route = [[fromLat, fromLng], [destLat, destLng]];
        try {
          const road = await fetchRoadRoute(fromLat, fromLng, destLat, destLng);
          if (road?.length) route = road;
        } catch (_) {}

        L.polyline(route, { color: "#bbf7d0", weight: 10, opacity: 0.9, lineCap: "round", lineJoin: "round" }).addTo(map);
        L.polyline(route, { color: "#16a34a", weight: 5, opacity: 1, lineCap: "round", lineJoin: "round" }).addTo(map);
        map.fitBounds(route, { padding: [40, 80] });

        const start = route[0];
        const head0 = route.length > 1 ? bearingDeg(route[0], route[1]) : 0;
        const rider = L.marker(start, { icon: riderIcon(head0), zIndexOffset: 600 }).addTo(map);

        jobNav = {
          map,
          rider,
          route,
          display: start,
          heading: head0,
          target: start,
          targetHeading: head0,
          gotGps: false,
          sim: 0,
          follow: true,
          lastTs: 0,
          raf: requestAnimationFrame(tickJobNav),
        };
        if (lastGps?.lat != null) updateJobRider(lastGps.lat, lastGps.lng, null);
        setTimeout(() => map.invalidateSize(), 120);
        return map;
      } catch (_) {}
    }

    function compressKtp(file) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) {
          reject(new Error("File harus berupa foto"));
          return;
        }
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 1400;
          let w = img.width;
          let h = img.height;
          if (w > max || h > max) {
            const scale = Math.min(max / w, max / h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL("image/jpeg", 0.82));
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Foto KTP tidak bisa dibaca"));
        };
        img.src = url;
      });
    }

          wrap?.classList.remove("hidden");

        loginErr = "";
        if (!ktpDataUrl) {
          loginErr = "Unggah foto KTP yang jelas dulu.";
          bindAuthPages();
          return;
        }
        const nik = String(fd.get("ktpNik") || "").replace(/\D/g, "");
        if (!nik || nik.length !== 16) {
          loginErr = "NIK wajib 16 digit setelah verifikasi KTP.";
          bindAuthPages();
          return;
        }
        if (!verifiedName || verifiedName.split(/\s+/).length < 2) {
          loginErr = "Nama sesuai KTP wajib minimal dua kata.";
          bindAuthPages();
          return;
        }
        try {
          const data = await api("/api/auth/register-courier", {
            method: "POST",
            body: JSON.stringify({
              fullName: verifiedName,
              phone: fd.get("phone"),
              email: fd.get("email"),
              password: fd.get("password"),
              ktpPhotoUrl: ktpDataUrl,
              nik,
              placeOfBirth: fd.get("ktpPlace"),
              dateOfBirth: fd.get("ktpDob"),
              addressOnKtp: fd.get("ktpAddress"),
              fullNameFromOcr: ktpDraft.fullNameFromOcr || ktpDraft.fullName,
              ocrConfidence: ktpDraft.ocrConfidence,
            }),
          });
            ktpDataUrl = "";
            ktpDraft = { nik: "", fullName: "", placeOfBirth: "", dateOfBirth: "", address: "", fullNameFromOcr: "", ocrConfidence: 0 };
            ktpMismatches = [];
            ktpOcrNote = "";
            draftReg.fullName = "";
            pendingMsg = data.message;
          authView = "pending";
          go("/pending");
        } catch (err) {
          loginErr = err.message;
          bindAuthPages();
        }
      });
      document.getElementById("ktp-complete")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        loginErr = "";
        if (!ktpDataUrl) {
          loginErr = "Pilih foto KTP yang jelas dulu.";
          bindAuthPages();
          return;
        }
        try {
          const data = await api("/api/auth/courier-ktp", {
            method: "POST",
            body: JSON.stringify({
              email: fd.get("email"),
              password: fd.get("password"),
              ktpPhotoUrl: ktpDataUrl,
            }),
          });
          pendingMsg = data.message;
          loginErr = "";
          bindAuthPages();
        } catch (err) {
          loginErr = err.message;
          bindAuthPages();
        }
      });
      document.getElementById("login-form")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        loginErr = "";
        try {
          const data = await api("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({ email: fd.get("email"), password: fd.get("password") }),
          });
          if (data.user.role !== "COURIER" && data.user.role !== "ADMIN") throw new Error("Pakai akun kurir");
          token = data.token;
          user = data.user;
          localStorage.setItem("dk_courier_token", token);
          localStorage.setItem("dk_courier_user", JSON.stringify(user));
          go("/home");
        } catch (err) {
          loginErr = err.message;
          if (/menunggu persetujuan/i.test(String(err.message))) {
            draftReg.email = String(fd.get("email") || "");
            draftReg.password = String(fd.get("password") || "");
            pendingMsg = err.message;
            authView = "pending";
            go("/pending");
            return;
          }
          bindAuthPages();
        }
      });
    }

    function bindAccountEdit() {
      const errEl = document.getElementById("acct-edit-err");
      document.getElementById("acct-edit-open")?.addEventListener("click", () => {
        editingCourierProfile = true;
        courierProfileError = "";
        go("/account");
      });
      document.getElementById("acct-edit-cancel")?.addEventListener("click", () => {
        editingCourierProfile = false;
        courierProfileError = "";
        go("/account");
      });
      document.getElementById("open-location")?.addEventListener("click", () => {
        showCourierLocationPanel = !showCourierLocationPanel;
        if (showCourierLocationPanel) showCourierPriorityPanel = false;
        go("/account").then(() => {
          if (!showCourierLocationPanel) return;
          const panel = document.getElementById("location-panel");
          panel?.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });
      document.getElementById("go-earnings")?.addEventListener("click", () => {
        go("/earnings");
      });
      document.getElementById("go-priority")?.addEventListener("click", () => {
        showCourierPriorityPanel = true;
        showCourierLocationPanel = false;
        go("/account").then(() => {
          const panel = document.getElementById("priority-panel");
          panel?.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });
      document.getElementById("close-priority")?.addEventListener("click", () => {
        showCourierPriorityPanel = false;
        go("/account");
      });
      document.getElementById("buy-priority")?.addEventListener("click", async () => {
        const btn = document.getElementById("buy-priority");
        if (btn?.dataset.busy === "1") return;
        const fee = profile?.priorityFee || 25000;
        const label = profile?.priorityLabel || ((profile?.priorityDays || 7) + " hari");
        const bank = (profile?.payoutAccount?.bankName || "BCA") + " " + (profile?.payoutAccount?.accountNumber || "");
        const proof = window.__priorityProofUrl || "";
        if (!proof.startsWith("data:image/")) {
          alert("Ambil foto bukti transfer dulu.");
          return;
        }
        if (!confirm("Kirim pengajuan prioritas " + rupiah(fee) + " / " + label + " ke " + bank + " beserta bukti transfer?")) return;
        if (btn) { btn.dataset.busy = "1"; btn.textContent = "Mengirim…"; }
        try {
          await api("/api/couriers/me/priority", {
            method: "POST",
            body: JSON.stringify({ confirmPay: true, proofUrl: proof }),
          });
          window.__priorityProofUrl = "";
          lastProfileAt = 0;
          profile = await api("/api/couriers/me");
          showCourierPriorityPanel = true;
          go("/account");
        } catch (e) {
          alert(e.message || "Gagal mengirim pengajuan");
          if (btn) { btn.dataset.busy = "0"; btn.textContent = "Kirim pengajuan"; }
        }
      });
      document.getElementById("priority-proof-input")?.addEventListener("change", async (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = "";
        if (!file || !file.type.startsWith("image/")) {
          alert("Bukti transfer harus berupa foto");
          return;
        }
        try {
          const dataUrl = await new Promise((resolve, reject) => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
              const max = 1400;
              let w = img.width;
              let h = img.height;
              if (w > max || h > max) {
                const scale = Math.min(max / w, max / h);
                w = Math.round(w * scale);
                h = Math.round(h * scale);
              }
              const canvas = document.createElement("canvas");
              canvas.width = w;
              canvas.height = h;
              canvas.getContext("2d").drawImage(img, 0, 0, w, h);
              URL.revokeObjectURL(url);
              resolve(canvas.toDataURL("image/jpeg", 0.82));
            };
            img.onerror = () => {
              URL.revokeObjectURL(url);
              reject(new Error("Foto tidak bisa dibaca"));
            };
            img.src = url;
          });
          window.__priorityProofUrl = dataUrl;
          const preview = document.getElementById("priority-proof-preview");
          const empty = document.getElementById("priority-proof-empty");
          const box = document.getElementById("priority-proof-box");
          if (preview) {
            preview.src = dataUrl;
            preview.classList.remove("hidden");
          }
          if (empty) empty.classList.add("hidden");
          if (box) {
            box.classList.remove("border-dashed", "border-[#D1D5DB]", "bg-[#F3F4F6]");
            box.classList.add("border-primary", "bg-[#F0FDF4]");
          }
        } catch (err) {
          alert(err.message || "Gagal membaca foto");
        }
      });
      document.querySelectorAll(".copy-payout").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const text = btn.getAttribute("data-copy") || "";
          if (!text) return;
          try { await navigator.clipboard.writeText(text); } catch (_) {}
          const prev = btn.textContent;
          btn.textContent = "Tersalin";
          setTimeout(() => { btn.textContent = prev; }, 1200);
        });
      });
      document.getElementById("go-orders")?.addEventListener("click", () => {
        go("/orders");
      });
      const toggleBtn = document.getElementById("toggle-online");
      if (toggleBtn && !toggleBtn.dataset.bound) {
        toggleBtn.dataset.bound = "1";
        toggleBtn.addEventListener("click", async () => {
          if (toggleBtn.dataset.busy === "1") return;
          toggleBtn.dataset.busy = "1";
          try {
            const next = !profile?.isOnline;
            try { navigator.vibrate?.(next ? [18, 40, 28] : [48]); } catch (_) {}
            await setOnline(next);
            lastProfileAt = 0;
            lastHomeSig = "";
            await go("/account");
          } catch (e) {
            alert(e.message || "Gagal ubah status");
          } finally {
            toggleBtn.dataset.busy = "0";
          }
        });
      }
      document.getElementById("acct-edit")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fullName = String(document.getElementById("acct-name")?.value || "").trim();
        const phone = String(document.getElementById("acct-phone")?.value || "").trim();
        if (!fullName) {
          courierProfileError = "Nama wajib diisi";
          go("/account");
          return;
        }
        const btn = document.getElementById("acct-edit-save");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "Menyimpan…";
        }
        try {
          const updated = await api("/api/couriers/me/profile", {
            method: "PATCH",
            body: JSON.stringify({ fullName, phone }),
          });
          profile = { ...profile, ...updated };
          if (user) {
            user.displayName = fullName;
            localStorage.setItem("dk_courier_user", JSON.stringify(user));
          }
          lastProfileAt = 0;
          editingCourierProfile = false;
          courierProfileError = "";
          go("/account");
        } catch (err) {
          courierProfileError = err.message || "Gagal menyimpan";
          if (errEl) {
            errEl.textContent = courierProfileError;
            errEl.classList.remove("hidden");
          }
        } finally {
          if (btn) {
            btn.disabled = false;
            btn.textContent = "Simpan";
          }
        }
      });
    }

    function bindCourierChrome() {
      const toggleBtn = document.getElementById("toggle-online");
      // Di halaman Akun, toggle sudah di-bind lewat bindAccountEdit (hindari double handler).
      if (!toggleBtn || toggleBtn.dataset.bound === "1") return;
      toggleBtn.addEventListener("click", async () => {
        if (toggleBtn.dataset.busy === "1") return;
        toggleBtn.dataset.busy = "1";
        try {
          await setOnline(!profile?.isOnline);
          lastProfileAt = 0;
          lastHomeSig = "";
          route();
        } catch (e) {
          alert(e.message || "Gagal ubah status");
        } finally {
          toggleBtn.dataset.busy = "0";
        }
      });
    }

    async function refreshListsQuiet() {
      const hash = location.hash || "";
      if (!hash.includes("home") && !hash.includes("orders") && hash !== "" && hash !== "#") return;
      try {
        const { available, mine } = await loadLists();
        const sig = JSON.stringify({
          on: profile?.isOnline,
          a: (available || []).map((o) => o.id),
          m: (mine || []).filter((o) => isActive(o.status)).map((o) => o.id + ":" + o.status),
        });
        if (sig === lastHomeSig) return;
        lastHomeSig = sig;
        const parts = hash.replace(/^#/, "").split("/").filter(Boolean);
        const app = document.getElementById("app");
        const y = app.scrollTop;
        if (parts[0] === "orders") app.innerHTML = pageOrders(available, mine);
        else app.innerHTML = pageHome(available, mine);
        app.scrollTop = y;
        bindCourierChrome();
      } catch (_) {}
    }

    async function route() {
      const gen = ++routeGen;
      stopJobNav();
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      if (offerTimer) { clearInterval(offerTimer); offerTimer = null; }
      if (chatTimer) { clearInterval(chatTimer); chatTimer = null; }
      const app = document.getElementById("app");
      const hash = (location.hash || "#/home").replace(/^#/, "");
      const parts = hash.split("/").filter(Boolean);
      const authPage = ["login", "register", "pending"].includes(parts[0]);

      if (!token) {
        authView = authPage ? parts[0] : "login";
        bindAuthPages();
        if (!authPage && (location.hash || "") !== "#/login") location.hash = "#/login";
        return;
      }
      if (authPage) {
        go("/home");
        return;
      }

      try {
        if (!profile || Date.now() - lastProfileAt > 12000) {
          profile = await api("/api/couriers/me");
          lastProfileAt = Date.now();
        }
      } catch (err) {
        token = "";
        localStorage.removeItem("dk_courier_token");
        loginErr = err.message || "Sesi habis. Masuk ulang.";
        go("/login");
        return;
      }
      if (gen !== routeGen) return;
      if (profile.isOnline) startGps();

      if (parts[0] === "offer") {
        paintNav("");
        const orderId = parts[1];
        let order = await api("/api/orders/" + encodeURIComponent(orderId));
        try {
          const available = await api("/api/couriers/me/available-orders");
          const hit = (available || []).find((o) => o.id === orderId);
          if (hit?.offer) order = { ...order, offer: hit.offer };
          else if (!hit) {
            alert("Penawaran ini sudah tidak untukmu (kurir lain lebih dekat, atau waktu habis).");
            go("/home");
            return;
          }
        } catch (_) {}
        app.innerHTML = pageOffer(order);
        const acceptBtn = document.getElementById("accept-order");
        const decline = async () => {
          try {
            await api("/api/orders/" + encodeURIComponent(order.id) + "/courier-decline", {
              method: "POST",
              body: JSON.stringify({}),
            });
          } catch (_) {}
          go("/home");
        };
        document.getElementById("decline-order")?.addEventListener("click", decline);
        document.getElementById("decline-order-2")?.addEventListener("click", decline);
        acceptBtn?.addEventListener("click", async () => {
          if (acceptBtn.dataset.busy === "1") return;
          acceptBtn.dataset.busy = "1";
          acceptBtn.textContent = "Memproses…";
          if (offerTimer) { clearInterval(offerTimer); offerTimer = null; }
          try {
            await api("/api/orders/" + encodeURIComponent(order.id) + "/assign-courier", {
              method: "POST",
              body: JSON.stringify({}),
              timeoutMs: 20000,
            });
            await api("/api/orders/" + encodeURIComponent(order.id) + "/courier-status", {
              method: "POST",
              body: JSON.stringify({ status: "COURIER_GOING_TO_OUTLET" }),
              timeoutMs: 20000,
            });
            const jobHash = "#/job/" + encodeURIComponent(order.id);
            showSuccessOverlay({
              title: "Pesanan diterima!",
              message: "Mulai menuju warung untuk mengambil pesanan.",
              onDone: () => { location.hash = jobHash; },
            });
          } catch (err) {
            acceptBtn.dataset.busy = "0";
            acceptBtn.textContent = "Terima";
            alert(err.message || "Gagal menerima order");
          }
        });
        const dest = order.merchants?.[0]?.merchant;
        try {
          await mountMap(
            "job-map",
            dest?.latitude || lastGps?.lat,
            dest?.longitude || lastGps?.lng,
            lastGps ? { lat: lastGps.lat, lng: lastGps.lng } : null
          );
        } catch (_) {}
        let timeLeft = Number(order.offer?.ttlSec ?? 45);
        const totalTime = Number(order.offer?.offerTtlSec ?? 45);
        const timerText = document.getElementById("timer-text");
        const timerRing = document.getElementById("timer-ring");
        const circumference = 2 * Math.PI * 40;
        if (timerText) timerText.textContent = String(Math.max(timeLeft, 0));
        if (timerRing) timerRing.style.strokeDashoffset = String(circumference - (Math.max(timeLeft, 0) / totalTime) * circumference);
        offerTimer = setInterval(async () => {
          timeLeft--;
          if (timerText) timerText.textContent = String(Math.max(timeLeft, 0));
          if (timerRing) timerRing.style.strokeDashoffset = String(circumference - (Math.max(timeLeft, 0) / totalTime) * circumference);
          if (timeLeft <= 10) {
            timerRing?.classList.add("text-[#ba1a1a]");
            timerRing?.classList.remove("text-primary");
            timerText?.classList.add("text-[#ba1a1a]");
            timerText?.classList.remove("text-primary");
          }
          if (timeLeft <= 0) {
            clearInterval(offerTimer);
            offerTimer = null;
            if (timerText) timerText.textContent = "—";
            // TTL habis → backend cascade ke kurir #2 saat poll berikutnya.
            go("/home");
          }
        }, 1000);
        return;
      }

      if (parts[0] === "job") {
        paintNav("");
        const order = await api("/api/orders/" + encodeURIComponent(parts[1]));
        app.innerHTML = pageJob(order);
        const nextBtn = document.getElementById("job-next");
        nextBtn?.addEventListener("click", async () => {
          if (nextBtn.dataset.busy === "1") return;
          nextBtn.dataset.busy = "1";
          try {
            const latest = await api("/api/orders/" + encodeURIComponent(order.id));
            if (goingOutlet(latest.status)) {
              if (!foodReady(latest)) {
                nextBtn.dataset.busy = "0";
                alert("Tunggu dapur menandai pesanan siap diambil");
                return;
              }
              await api("/api/orders/" + encodeURIComponent(order.id) + "/courier-status", { method: "POST", body: JSON.stringify({ status: "PICKED_UP" }) });
              await api("/api/orders/" + encodeURIComponent(order.id) + "/courier-status", { method: "POST", body: JSON.stringify({ status: "DELIVERING" }) });
              route();
              return;
            }
            if (latest.status !== "DELIVERED") {
              await api("/api/orders/" + encodeURIComponent(order.id) + "/courier-status", { method: "POST", body: JSON.stringify({ status: "DELIVERED" }) });
            }
            await api("/api/orders/" + encodeURIComponent(order.id) + "/complete", { method: "POST", body: JSON.stringify({}) });
            const earn = latest.courierEarning || latest.deliveryFee || order.courierEarning || 0;
            const total = latest.grandTotal || order.grandTotal || 0;
            showSuccessOverlay({
              title: "BERHASIL!",
              message: "Pembayaran tunai sudah diterima. Ongkir kamu " + rupiah(earn) + ".",
              amountLabel: rupiah(total),
              onDone: () => go("/home"),
            });
          } catch (err) {
            nextBtn.dataset.busy = "0";
            alert(err.message || "Gagal update order");
          }
        });
        const dest = goingOutlet(order.status)
          ? order.merchants?.[0]?.merchant
          : { latitude: order.deliveryLatitude, longitude: order.deliveryLongitude };
        try {
          await mountMap(
            "job-map",
            dest?.latitude || lastGps?.lat,
            dest?.longitude || lastGps?.lng,
            lastGps ? { lat: lastGps.lat, lng: lastGps.lng } : null
          );
        } catch (_) {}
        document.getElementById("recenter")?.addEventListener("click", () => {
          if (!jobNav?.map) return;
          jobNav.follow = true;
          if (jobNav.display) jobNav.map.setView(jobNav.display, 17);
        });
        const maps = document.getElementById("maps-link");
        if (maps && dest?.latitude) maps.href = `https://www.google.com/maps/dir/?api=1&destination=${dest.latitude},${dest.longitude}`;
        bindOrderChat(order, "COURIER", customerName(order), [
          "Saya sudah di lokasi",
          "Mohon tunggu sebentar",
          "Pesanan sudah dijemput",
        ]);
        document.getElementById("open-chat-2")?.addEventListener("click", () => document.getElementById("open-chat")?.click());
        pollTimer = setInterval(async () => {
          try {
            const latest = await api("/api/orders/" + encodeURIComponent(order.id));
            const btn = document.getElementById("job-next");
            if (btn && goingOutlet(latest.status)) {
              const label = btn.querySelector("span");
              if (label) label.textContent = foodReady(latest) ? "Konfirmasi pickup" : "Menunggu dapur siap";
            }
          } catch (_) {}
        }, 4000);
        return;
      }

      if (parts[0] === "help") {
        const reports = await api("/api/support-reports/me");
        if (gen !== routeGen) return;
        app.innerHTML = pageHelp(reports);
        document.getElementById("help-form")?.addEventListener("submit", async (e) => {
          e.preventDefault();
          if (helpBusy) return;
          helpBusy = true;
          helpError = "";
          helpMessage = "";
          route().catch(showBootError);
          const fd = new FormData(e.target);
          try {
            const res = await api("/api/support-reports", {
              method: "POST",
              body: JSON.stringify({
                category: fd.get("category"),
                subject: fd.get("subject"),
                body: fd.get("body"),
                orderId: fd.get("orderId") || undefined,
              }),
            });
            helpMessage = res.message || "Laporan terkirim.";
            helpBusy = false;
            route().catch(showBootError);
          } catch (err) {
            helpError = err.message || "Gagal mengirim laporan";
            helpBusy = false;
            route().catch(showBootError);
          }
        });
        bindCourierChrome();
        paintNav(null);
        return;
      }

      const { available, mine } = await loadLists();
      if (gen !== routeGen) return;
      lastHomeSig = JSON.stringify({
        on: profile?.isOnline,
        a: (available || []).map((o) => o.id),
        m: (mine || []).filter((o) => isActive(o.status)).map((o) => o.id + ":" + o.status),
      });
      if (parts[0] === "orders") app.innerHTML = pageOrders(available, mine);
      else if (parts[0] === "earnings") app.innerHTML = pageEarnings(mine);
      else if (parts[0] === "account") {
        app.innerHTML = pageAccount();
        bindAccountEdit();
        if (showCourierLocationPanel) await mountAccountPicker();
        document.getElementById("logout")?.addEventListener("click", () => {
          stopGps();
          token = ""; user = null; profile = null;
          lastProfileAt = 0;
          editingCourierProfile = false;
          showCourierLocationPanel = false;
          localStorage.removeItem("dk_courier_token");
          localStorage.removeItem("dk_courier_user");
          go("/login");
        });
      } else app.innerHTML = pageHome(available, mine);

      bindCourierChrome();
      paintNav("#/" + (parts[0] || "home"));
      if (parts[0] === "home" || parts[0] === "orders" || !parts[0]) {
        pollTimer = setInterval(refreshListsQuiet, 10000);
      }
    }

    window.addEventListener("hashchange", () => {
      route().catch(showBootError);
    });
    if (!location.hash) location.hash = token ? "#/home" : "#/login";
    const splashEl = document.getElementById("dk-splash");
    const splashMin = new Promise((resolve) => setTimeout(resolve, 1800));
    Promise.all([route().catch(showBootError), splashMin]).then(() => {
      if (!splashEl) return;
      splashEl.classList.add("is-leave");
      splashEl.setAttribute("aria-busy", "false");
      setTimeout(() => splashEl.remove(), 400);
    });

    function showBootError(err) {
      token = "";
      try {
        localStorage.removeItem("dk_courier_token");
        localStorage.removeItem("dk_courier_user");
      } catch (_) {}
      paintStandaloneLogin(err && err.message ? err.message : "Gagal memuat. Masuk ulang di bawah.");
    }
  </script>
</body>
