<!DOCTYPE html>

  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; background: #FFFFFF; color: #111; }

    .material-symbols-outlined.fill { font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24; }
    .dk-nav {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 50;
      width: min(84vw, 380px);
      transform: translateX(-50%);

    #nav-root.is-off .dk-nav {

      transform: translateX(-50%) translateY(16px);
    }
    .dk-nav-bar {
      position: relative;
      height: 72px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      box-shadow:
        0 10px 32px rgba(0, 0, 0, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.72);

      align-items: center;
      padding: 0 8px;
      overflow: hidden;
      box-sizing: border-box;
    }
    .dk-nav-thumb {
      position: absolute;

      height: 52px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.16);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);

    .dk-nav-item {

      align-items: center;

    .dk-nav-item.is-on { color: #16A34A; }
    .dk-nav-item svg, .dk-nav-item .material-symbols-outlined {
      display: block;
      width: 24px;
      height: 24px;
      font-size: 24px;
      transition: transform .28s cubic-bezier(.22,1,.36,1);
    }
    .dk-nav-item.is-on svg, .dk-nav-item.is-on .material-symbols-outlined { transform: scale(1.12); }
    .dk-nav-item::after {
      content: "";

      bottom: 6px;
      left: 50%;
      width: 5px;
      height: 5px;
      margin-left: -2.5px;
      border-radius: 999px;
      background: #22C55E;
      opacity: 0;
      transform: scale(.5);

    .dk-nav-item.is-on::after { opacity: 1; transform: scale(1); }

    .dk-progress { display: flex; align-items: flex-start; width: 100%; }
    .dk-col { display: flex; flex-direction: column; align-items: center; width: 54px; flex-shrink: 0; }
    .dk-node {
      width: 36px; height: 36px; border-radius: 9999px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .dk-node.on { background: #1b1b1d; color: #fff; }
    .dk-node.off { background: #eceae8; color: #8a8580; }
    .dk-node.now {
      position: relative;
      z-index: 1;
      animation: dk-node-bob 1.15s ease-in-out infinite;
    }
    .dk-node.now::before {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 999px;
      border: 2px solid rgba(34, 197, 94, .55);
      animation: dk-node-ring 1.6s ease-out infinite;
    }
    .dk-node .material-symbols-outlined { font-size: 18px; color: inherit; }
    .dk-lab {
      margin-top: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.01em;
      color: #8a8580; line-height: 1.2; text-align: center; white-space: nowrap;
    }
    .dk-lab.on { color: #1b1b1d; }
    .dk-lab.now { color: #16A34A; }
    .dk-line {
      flex: 1; height: 4px; background: #eceae8; border-radius: 999px;
      position: relative; overflow: visible; margin: 16px 4px 0;
    }
    .dk-line > i {
      display: block; height: 100%; width: 0;
      background: #22C55E; border-radius: inherit;
    }
    .dk-line.live > i {
      position: relative;
      overflow: visible;
      background: #22C55E;
      animation: dk-fill-walk 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .dk-line.live > i::after {
      content: "";
      position: absolute;
      right: 0;
      top: 50%;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #111;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, .28), 0 1px 4px rgba(0,0,0,.2);
      transform: translate(50%, -50%);
    }
    @keyframes dk-node-bob {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.06); }
    }
    @keyframes dk-node-ring {
      0% { transform: scale(.92); opacity: .85; }
      100% { transform: scale(1.28); opacity: 0; }
    }
    @keyframes dk-fill-walk {
      0% { width: 0; }
      82% { width: 100%; }
      100% { width: 100%; }
    }
    .leaflet-container { width: 100%; height: 100%; background: #dce6ef; z-index: 0; }
    .dk-pin-inner {
      width: 28px; height: 28px; border-radius: 999px; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font: 700 8px "Plus Jakarta Sans", sans-serif;
      border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(.86); }
      70% { transform: scale(1.06); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50% { transform: translateY(-10px) rotate(4deg); }
    }
    @keyframes floatY2 {
      0%, 100% { transform: translateY(0) rotate(8deg); }
      50% { transform: translateY(-8px) rotate(-4deg); }
    }
    @keyframes scooter {
      0%, 100% { transform: translate(0, 0) rotate(-8deg); }
      50% { transform: translate(-8px, -12px) rotate(4deg); }
    }
    @keyframes shimmer {
      0% { background-position: -40% 0; }
      100% { background-position: 140% 0; }
    }
    @keyframes pulseSoft {
      0%, 100% { box-shadow: 0 8px 24px rgba(34,197,94,.28); }
      50% { box-shadow: 0 12px 32px rgba(34,197,94,.45); }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-10deg); }
      75% { transform: rotate(10deg); }
    }
    @keyframes dk-fire-body {
      0%, 100% { transform: scale(1, 1) translateY(0); }
      18% { transform: scale(1.008, 1.03) translateY(-0.6px); }
      36% { transform: scale(0.996, 1.014) translateY(0.2px); }
      54% { transform: scale(1.01, 1.034) translateY(-0.9px); }
      71% { transform: scale(1.004, 1.022) translateY(-0.3px); }
      88% { transform: scale(0.998, 1.01) translateY(0.1px); }
    }
    @keyframes dk-fire-bright {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 2px rgba(234, 88, 12, 0.28)); }
      14% { opacity: 0.9; filter: drop-shadow(0 0 1px rgba(234, 88, 12, 0.18)); }
      31% { opacity: 0.97; filter: drop-shadow(0 0 3px rgba(249, 115, 22, 0.34)); }
      48% { opacity: 0.88; filter: drop-shadow(0 0 2px rgba(234, 88, 12, 0.22)); }
      63% { opacity: 0.95; filter: drop-shadow(0 0 3px rgba(251, 146, 60, 0.3)); }
      79% { opacity: 0.92; filter: drop-shadow(0 0 2px rgba(234, 88, 12, 0.24)); }
      92% { opacity: 0.98; filter: drop-shadow(0 0 3px rgba(249, 115, 22, 0.32)); }
    }
    .dk-fire-live {
      display: inline-block;
      color: #EA580C;
      transform-origin: 50% 90%;
      animation:
        dk-fire-body 2.8s ease-in-out infinite,
        dk-fire-bright 1.95s ease-in-out infinite;
    }
    @keyframes dash {
      to { stroke-dashoffset: 0; }
    }
    @keyframes blob {
      0%, 100% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.12) translate(8px, -6px); }
    }
    .cart-enter { animation: cartIn .38s cubic-bezier(.22,1,.36,1) both; }
    .cart-exit { animation: cartOut .32s ease both; }
    .cart-bump { animation: cartBump .38s ease; }
    .dk-fab.cart-enter, .dk-fab.cart-exit, .dk-fab.cart-bump { animation: none; }
    .dk-fab.cart-enter .dk-cartbar { animation: cartBarIn .38s cubic-bezier(.22,1,.36,1) both; }
    .dk-fab.cart-exit .dk-cartbar { animation: cartBarOut .32s ease both; }
    .dk-fab.cart-bump .dk-cartbar { animation: cartBarBump .38s ease; }
    @keyframes cartIn {
      0% { opacity: 0; transform: scale(.86); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes cartOut {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(.86); }
    }
    @keyframes cartBump {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.12); }
    }
    @keyframes cartBarIn {
      0% { opacity: 0; transform: translateY(18px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes cartBarOut {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(18px); }
    }
    @keyframes cartBarBump {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-4px); }
    }
    .qty-btn {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 0;
      flex-shrink: 0;
    }
    .qty-btn svg { display: block; width: 16px; height: 16px; }
    .price-pill {
      display: inline-flex;
      align-items: center;

      border-radius: 999px;
      background: rgba(17,17,17,.82);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .dk-cart-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 999px;
      background: #22C55E;
      color: #fff;

      place-items: center;

    .anim-up { animation: fadeUp .55s cubic-bezier(.22,1,.36,1) both; }
    .anim-pop { animation: popIn .45s cubic-bezier(.22,1,.36,1) both; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .1s; } .d3 { animation-delay: .16s; }
    .d4 { animation-delay: .22s; } .d5 { animation-delay: .28s; } .d6 { animation-delay: .34s; }
    .d7 { animation-delay: .4s; } .d8 { animation-delay: .46s; }
    .press { transition: transform .16s ease, box-shadow .16s ease; }
    .press:active { transform: scale(.92); }
    .icon-bounce:hover .material-symbols-outlined { animation: wiggle .45s ease; }
    .card-lift { transition: transform .25s ease, box-shadow .25s ease; }
    .card-lift:hover, .card-lift:active { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,.08); }
    .img-zoom { overflow: hidden; }
    .img-zoom img { transition: transform .55s ease; }
    .img-zoom:hover img { transform: scale(1.08); }

    }
    .blob { position: absolute; border-radius: 999px; filter: blur(2px); animation: blob 5s ease-in-out infinite; }

      background:

        radial-gradient(80% 55% at 8% 92%, #DCFCE7 0%, transparent 52%),

      height: 168px;
      margin: 8px auto 8px;
      animation: otpArtFloat 3.4s ease-in-out infinite;
    }

      const idx = list.findIndex((m) => m.id === last);

      return list.slice(idx + 1).filter((m) => m.senderRole !== meRole).length;

    function chatImageSrc(body) {

    function compressChatImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 720;
          let w = img.width;
          let h = img.height;
          if (w > max || h > max) {
            const scale = Math.min(max / w, max / h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL("image/jpeg", 0.7));
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Gagal baca foto"));
        };
        img.src = url;
      });
    }
    function chatDayLabel(iso) {

        const dayChip = day && day !== lastDay
          ? `<div class="flex justify-center py-1"><span class="text-[11px] text-[#8E8E93] bg-[#E8E8ED] px-3 py-1 rounded-full">${esc(day)}</span></div>`

    function bindOrderChat(order, chips) {
      const overlay = document.getElementById("order-chat");
      const listEl = document.getElementById("chat-list");
      const form = document.getElementById("chat-form");
      const input = document.getElementById("chat-input");
      const chipsEl = document.getElementById("chat-chips");

        ).join("");
      }
      let me = "CUSTOMER";
      const chatOpen = () => !overlay.classList.contains("hidden");
      const refreshChat = async () => {
        try {
          const data = await api("/api/orders/" + encodeURIComponent(order.id) + "/chat");
          me = data.me || "CUSTOMER";
          if (chatOpen()) {
            renderChatMessages(listEl, data.messages, me);
            markChatRead(order.id, me, data.messages);
            paintChatBadge(0);
          } else {
            paintChatBadge(unreadChatCount(data.messages, me, order.id));
          }
        } catch (_) {}
      };
      const openChat = () => {
        overlay.classList.remove("hidden");
        refreshChat();
        setTimeout(() => input.focus(), 50);
      };
      window.openDkChat = openChat;
      if (window.__dkOpenChat) {
        window.__dkOpenChat = false;
        openChat();
      }
      const openBtn = document.getElementById("open-chat");
      if (openBtn) openBtn.onclick = openChat;
      if (!overlay.dataset.bound) {
        overlay.dataset.bound = "1";
        const syncComposer = () => {
          const has = String(input.value || "").trim().length > 0;
          document.getElementById("chat-send")?.classList.toggle("hidden", !has);
        };
        input.addEventListener("input", syncComposer);
        document.getElementById("chat-close")?.addEventListener("click", () => {

        document.getElementById("chat-plus")?.addEventListener("click", (e) => {

        document.getElementById("chat-cam")?.addEventListener("click", () => photoInput?.click());
        photoInput?.addEventListener("change", async () => {
          const file = photoInput.files && photoInput.files[0];

          if (!file) return;
          if (!String(file.type || "").startsWith("image/")) {
            alert("Pilih foto.");
            return;
          }
          try {
            const dataUrl = await compressChatImage(file);
            await api("/api/orders/" + encodeURIComponent(order.id) + "/chat", {
              method: "POST",
              body: JSON.stringify({ body: "IMG:" + dataUrl }),
            });
            await refreshChat();
          } catch (err) {
            alert(err.message || "Gagal kirim foto");
          }
        });
        chipsEl?.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-chip]");
          if (!btn) return;
          input.value = btn.getAttribute("data-chip") || "";

          input.focus();
        });
        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          try {
            await api("/api/orders/" + encodeURIComponent(order.id) + "/chat", {
              method: "POST",
              body: JSON.stringify({ body }),
            });
            await refreshChat();
          } catch (err) {
            alert(err.message || "Gagal kirim pesan");
          }
        });
      }
      refreshChat();
      if (chatTimer) clearInterval(chatTimer);
      chatTimer = setInterval(refreshChat, 2500);
    }

    function loadMapsScript() {
      if (!mapsKey) return Promise.resolve(false);
      if (window.google && window.google.maps) return Promise.resolve(true);
      return new Promise((resolve) => {
        const s = document.createElement("script");
        s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(mapsKey);
        s.onload = () => resolve(true);
        s.onerror = () => resolve(false);
        document.head.appendChild(s);
      });
    }

    function gpsPosition() {
      const once = () => new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error("Browser tidak mendukung lokasi"));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (p) => resolve({
            latitude: p.coords.latitude,
            longitude: p.coords.longitude,
            accuracy: p.coords.accuracy,
          }),
          (e) => reject(new Error(e.message || "Izin lokasi ditolak")),
          { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 }
        );
      });
      return once().then(async (pos) => {
        if ((pos.accuracy || 999) <= 35) return pos;
        try {
          const again = await once();
          if ((again.accuracy || 999) < (pos.accuracy || 999)) return again;
        } catch (_) {}
        return pos;
      });
    }

    function looksLikeCoordinates(value) {
      return /^-?\d+(\.\d+)?,\s*-?\d+(\.\d+)?$/.test(String(value || "").trim());

    async function setDeliveryPoint(lat, lng) {
      delivery.latitude = Number(lat);
      delivery.longitude = Number(lng);
      try {
        const geo = await api("/api/geo/reverse", {
          method: "POST",
          body: JSON.stringify({ latitude: delivery.latitude, longitude: delivery.longitude }),
        });
        delivery.address = geo.address;
        if (geo.latitude != null) delivery.latitude = geo.latitude;
        if (geo.longitude != null) delivery.longitude = geo.longitude;
      } catch (_) {
        delivery.address = delivery.latitude.toFixed(5) + ", " + delivery.longitude.toFixed(5);
      }
      saveDelivery();
      paintDeliveryLabels();
      try {
        await api("/api/customers/me/location", { method: "PATCH", body: JSON.stringify(delivery) });
      } catch (_) {}
      if (typeof window.__dkRefreshQuote === "function") {
        clearTimeout(quoteTimer);
        quoteTimer = setTimeout(() => window.__dkRefreshQuote(), 500);

      return delivery;

        map.fitBounds(bounds.pad(0.28));
      }
      setTimeout(() => map.invalidateSize(), 120);
      trackMapRef = { engine: "leaflet", map, courierMarker, dest, courierTrail: [], routeKey: "", routePolyline: null, trailPolyline: null };

    }

    function routeTarget(order) {
      const dest = trackMapRef?.dest || orderDest(order);
      if (order.status === "COURIER_GOING_TO_OUTLET") {
        const m = (order.merchants || [])[0]?.merchant;
        if (m?.latitude != null) return { lat: Number(m.latitude), lng: Number(m.longitude) };
      }
      return dest;
    }

    async function updateTrackRoute(order) {
      if (!trackMapRef || trackMapRef.engine === "iframe") return;
      const lat = order.courier?.lastLatitude;
      const lng = order.courier?.lastLongitude;
      if (lat == null || lng == null || !isLiveCourierTrack(order.status)) return;
      const courier = { lat: Number(lat), lng: Number(lng) };
      const target = routeTarget(order);
      const key = `${courier.lat.toFixed(4)},${courier.lng.toFixed(4)}->${target.lat.toFixed(4)},${target.lng.toFixed(4)}`;
      if (trackMapRef.routeKey === key) return;
      trackMapRef.routeKey = key;
      const path = await fetchDrivingPath(courier, target);
      if (!trackMapRef || trackMapRef.routeKey !== key) return;
      if (trackMapRef.engine === "leaflet" && trackMapRef.map) {
        const latlngs = path.map((p) => [p.lat, p.lng]);
        if (trackMapRef.routePolyline) trackMapRef.routePolyline.setLatLngs(latlngs);
        else {
          trackMapRef.routePolyline = L.polyline(latlngs, {
            color: "#22C55E", weight: 5, opacity: 0.9,
          }).addTo(trackMapRef.map);
        }
      } else if (trackMapRef.engine === "google" && window.google) {
        if (trackMapRef.routePolyline) trackMapRef.routePolyline.setMap(null);
        trackMapRef.routePolyline = new google.maps.Polyline({
          path,
          map: trackMapRef.map,
          strokeColor: "#22C55E",
          strokeWeight: 5,
          strokeOpacity: 0.9,
        });
      }
    }

    function appendCourierTrail(lat, lng) {
      if (!trackMapRef || trackMapRef.engine === "iframe") return;
      const pt = [lat, lng];
      const trail = trackMapRef.courierTrail || [];
      const last = trail[trail.length - 1];
      if (last) {
        const d = haversineM({ lat: last[0], lng: last[1] }, { lat, lng });
        if (d < 12) return;
      }
      trail.push(pt);
      if (trail.length > 150) trail.shift();
      trackMapRef.courierTrail = trail;
      if (trackMapRef.engine === "leaflet" && trackMapRef.map) {
        if (trackMapRef.trailPolyline) trackMapRef.trailPolyline.setLatLngs(trail);
        else {
          trackMapRef.trailPolyline = L.polyline(trail, {
            color: "#86EFAC", weight: 4, opacity: 0.75, dashArray: "8 10",
          }).addTo(trackMapRef.map);
        }
      } else if (trackMapRef.engine === "google" && window.google) {
        if (trackMapRef.trailPolyline) trackMapRef.trailPolyline.setMap(null);
        trackMapRef.trailPolyline = new google.maps.Polyline({
          path: trail.map(([la, ln]) => ({ lat: la, lng: ln })),
          map: trackMapRef.map,
          strokeColor: "#86EFAC",
          strokeWeight: 4,
          strokeOpacity: 0.75,
        });
      }
    }

    function updateCourierOnMap(order) {
      const lat = order.courier?.lastLatitude;
      const lng = order.courier?.lastLongitude;
      if (lat == null || lng == null || !trackMapRef) return;
      appendCourierTrail(Number(lat), Number(lng));
      if (trackMapRef.engine === "leaflet" && trackMapRef.map) {
        if (trackMapRef.courierMarker) trackMapRef.courierMarker.setLatLng([lat, lng]);
        else {
          trackMapRef.courierMarker = L.marker([lat, lng], {
            icon: leafletPin("Kurir", "#008376"),
            title: order.courier?.fullName || "Kurir",
          }).addTo(trackMapRef.map);
        }
        if (isLiveCourierTrack(order.status)) {
          const dest = trackMapRef.dest || orderDest(order);
          trackMapRef.map.fitBounds(
            L.latLngBounds([[lat, lng], [dest.lat, dest.lng]]).pad(0.22),
            { animate: true, duration: 0.6 }
          );
        }
      } else if (trackMapRef.engine === "google" && window.google) {
        const p = { lat: Number(lat), lng: Number(lng) };
        if (trackMapRef.courierMarker) trackMapRef.courierMarker.setPosition(p);
        else {
          trackMapRef.courierMarker = new google.maps.Marker({
            position: p,
            map: trackMapRef.map,
            title: order.courier?.fullName || "Kurir",
            icon: {
              path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
              scale: 6,
              fillColor: "#22C55E",
              fillOpacity: 1,
              strokeWeight: 1,
              strokeColor: "#fff",
            },
          });
        }
      }
      if (isLiveCourierTrack(order.status)) updateTrackRoute(order);
    }

    function addressParts(raw) {
      const text = String(raw || "").trim() || "Pilih alamat pengantaran";
      const bits = text.split(",").map((s) => s.trim()).filter(Boolean);
      return { title: bits[0] || text, rest: bits.slice(1).join(" · ") };
    }
    function km(m) {
      const R = 6371;
      const dLat = ((m.latitude - delivery.latitude) * Math.PI) / 180;
      const dLng = ((m.longitude - delivery.longitude) * Math.PI) / 180;
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos((delivery.latitude * Math.PI) / 180) *
        Math.cos((m.latitude * Math.PI) / 180) *
        Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function normCat(value) {
      return String(value || "").trim().toLowerCase();
    }
    function menuMatchesCat(item, cat) {
      const itemCat = normCat(item?.category);
      const target = normCat(cat.category || cat.label);
      if (itemCat && (itemCat === target || itemCat === normCat(cat.key))) return true;
      if (!itemCat || itemCat === "makanan" || itemCat === "lainnya") {
        const blob = [item?.name, item?.description].join(" ").toLowerCase();
        return cat.keys.some((k) => blob.includes(k));
      }
      return false;
    }
    function menuBlob(merchant, item) {
      return [item?.name, item?.description, item?.category, merchant?.name, merchant?.description]
        .join(" ")
        .toLowerCase();
    }
    function menusForCat(merchants, cat) {
      if (!cat || cat.key === "hemat") return [];
      const hits = [];
      (merchants || []).forEach((m) => {
        (m.menus || []).forEach((item) => {
          if (menuMatchesCat(item, cat)) hits.push({ merchant: m, item });
        });
      });
      return hits;
    }
    function menusForQuery(merchants, q) {
      if (!q) return [];
      const hits = [];
      (merchants || []).forEach((m) => {
        (m.menus || []).forEach((item) => {
          if (menuBlob(m, item).includes(q)) hits.push({ merchant: m, item });
        });
      });
      return hits;
    }

    function bindRejectBanner() {
      const dismiss = () => {
        const btn = document.getElementById("dismiss-reject");
        const ids = String(btn?.dataset.ids || "").split(",").filter(Boolean);
        const seen = rejectSeen();
        ids.forEach((id) => { if (!seen.includes(id)) seen.push(id); });
        localStorage.setItem("dk_reject_seen", JSON.stringify(seen.slice(-80)));
        const box = document.getElementById("reject-banner");
        if (box) box.outerHTML = `<div id="reject-banner"></div>`;
      };
      document.getElementById("dismiss-reject")?.addEventListener("click", dismiss);
      document.getElementById("reject-order-again")?.addEventListener("click", (e) => {

    function trackStage(status) {
      if (status === "COMPLETED" || status === "DELIVERED") return 3;
      if (status === "PICKED_UP" || status === "DELIVERING") return 2;
      if (["OUTLET_ACCEPTED", "PREPARING", "READY_FOR_PICKUP", "COURIER_ASSIGNED", "COURIER_GOING_TO_OUTLET"].includes(status)) return 1;
      return 0;
    }
    const CANCELABLE_STATUSES = new Set([
      "WAITING_OUTLET", "OUTLET_ACCEPTED", "PREPARING", "READY_FOR_PICKUP",
      "COURIER_ASSIGNED", "COURIER_GOING_TO_OUTLET",
    ]);
    function canCancelOrder(order) {
      return order && CANCELABLE_STATUSES.has(order.status);
    }
    function isSearchingCourier(order) {
      return order && !order.courierId && ["OUTLET_ACCEPTED", "PREPARING", "READY_FOR_PICKUP"].includes(order.status);
    }
    function isLiveCourierTrack(status) {
      return ["COURIER_GOING_TO_OUTLET", "PICKED_UP", "DELIVERING"].includes(status);
    }
    function haversineM(a, b) {
      const R = 6371000;
      const dLat = (b.lat - a.lat) * Math.PI / 180;
      const dLng = (b.lng - a.lng) * Math.PI / 180;
      const x = Math.sin(dLat / 2) ** 2
        + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(x));
    }
    async function fetchDrivingPath(from, to) {
      const fallback = [{ lat: from.lat, lng: from.lng }, { lat: to.lat, lng: to.lng }];
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();
        const coords = data?.routes?.[0]?.geometry?.coordinates;
        if (coords?.length) return coords.map(([lng, lat]) => ({ lat, lng }));
      } catch (_) {}
      return fallback;
    }
    function etaWindow(order) {
      const mins = Number(order?.etaMinutes) || Math.max(18, (Number(order?.billedDistanceKm) || 5) * 4);
      const start = new Date(Date.now() + mins * 60000);
      const end = new Date(start.getTime() + 5 * 60000);
      const f = (d) => d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
      return f(start) + "–" + f(end);
    }
    function trackTitle(status, order) {
      if (status === "CANCELLED") return "Pesanan dibatalkan";
      if (order && isSearchingCourier(order)) return "Mencari kurir";
      const s = trackStage(status);
      if (s === 0) return "Pesanan diterima";
      if (s === 1) return "Sedang disiapkan";
      if (s === 2) return "Sedang diantar";
      return "Pesanan selesai";
    }
    function formatClock(iso) {
      if (!iso) return "";
      return new Date(iso).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
    }
    function trackEta(order) {
      if (order.status === "CANCELLED") return { prefix: "", time: "Tidak dilanjutkan" };
      if (trackStage(order.status) >= 3) {
        const t = formatClock(order.deliveredAt || order.completedAt);
        return { prefix: "Tiba pukul ", time: t || "—" };
      }
      return { prefix: "Tiba sekitar ", time: etaWindow(order) };
    }
    function trackSubtitle(order) {
      const e = trackEta(order);
      return (e.prefix + e.time).trim();
    }
    function trackBlurb(status, order) {
      const s = trackStage(status);
      if (status === "CANCELLED") {
        const reason = String(order?.cancelReason || "");
        if (reason.includes("pelanggan")) return "Pesanan dibatalkan atas permintaan kamu.";
        return "Warung menolak pesanan. Silakan pilih makanan dari warung lain.";
      }
      if (order && isSearchingCourier(order)) {
        return "Sistem sedang mencari kurir terdekat. Jika terlalu lama, kamu bisa batalkan pesanan.";
      }
      if (s === 0) return "Customer: pesananmu sudah diterima. Berikutnya warung menyiapkan makanan.";
      if (s === 1) return "Warung: makanan sedang dimasak. Berikutnya kurir mengambil dan mengantar ke rumahmu.";
      if (s === 2) return "Kurir: pesanan sudah diambil. Ikuti posisi kurir di peta menuju alamatmu.";
      return "Rumah: pesanan sudah tiba di alamatmu. Selamat menikmati!";
    }
    function deliveryProgressHtml(status) {
      const stage = trackStage(status);
      const nodes = [
        { ic: "person", lab: "Customer" },
        { ic: "storefront", lab: "Warung" },
        { ic: "directions_car", lab: "Kurir" },
        { ic: "home", lab: "Rumah" },
      ];
      let html = `<div class="dk-progress" data-status="${stage}" aria-label="Status pengantaran">`;
      nodes.forEach((n, i) => {
        const on = stage >= 3 || i <= stage;
        const current = stage < 3 && i === stage;
        html += `<div class="dk-col">
          <div class="dk-node ${on ? "on" : "off"}${current ? " now" : ""}">${icon(n.ic)}</div>
          <span class="dk-lab ${current ? "now" : on ? "on" : ""}">${n.lab}</span>
        </div>`;
        if (i < 3) {
          const done = stage > i || stage >= 3;
          const live = !done && i === stage;
          html += `<div class="dk-line${live ? " live" : ""}"><i${done ? ' style="width:100%"' : live ? "" : ' style="width:0"'}></i></div>`;
        }
      });
      html += `</div>`;
      return html;
    }

    function bindDraggableSheet(sheetId, handleId, onResize, ratios, startIdx) {
      const sheet = document.getElementById(sheetId);
      const handle = document.getElementById(handleId);
      if (!sheet || !handle) return;
      const mapEl = document.getElementById(
        sheetId === "checkout-sheet"
          ? (document.getElementById("checkout-map-wrap") ? "checkout-map-wrap" : "checkout-map")
          : sheetId === "track-sheet" ? "track-map" : ""
      );
      const snaps = () => {
        const h = window.innerHeight;
        if (sheetId === "checkout-sheet") {
          return [112, Math.round(h * 0.5), Math.round(h * 0.95)];
        }
        const r = ratios || [0.22, 0.58, 0.88];
        return r.map((x) => Math.round(h * x));
      };
      const clamp = (px) => {
        const pts = snaps();
        return Math.max(pts[0], Math.min(pts[pts.length - 1], px));
      };
      const refreshMap = () => {
        onResize?.();
        pickerMapRef?.invalidateSize?.();
        trackMapRef?.map?.invalidateSize?.();
        if (window.google && trackMapRef?.engine === "google") {
          google.maps.event.trigger(trackMapRef.map, "resize");
        }
      };
      const apply = (px, animate) => {
        const h = clamp(px);
        sheet.style.transition = animate ? "height 220ms ease" : "none";
        sheet.style.height = h + "px";
        if (mapEl) {
          mapEl.style.transition = animate ? "bottom 220ms ease" : "none";
          mapEl.style.bottom = h + "px";
        }
        if (animate) setTimeout(refreshMap, 230);
        else refreshMap();
      };
      apply(snaps()[startIdx ?? 1], false);
      let dragging = false;
      let startY = 0;
      let startH = 0;
      let moved = 0;
      handle.addEventListener("pointerdown", (e) => {
        dragging = true;
        moved = 0;
        startY = e.clientY;
        startH = sheet.getBoundingClientRect().height;
        handle.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      handle.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const dy = startY - e.clientY;
        moved = Math.max(moved, Math.abs(dy));
        apply(startH + dy, false);
      });
      const endDrag = () => {
        if (!dragging) return;
        dragging = false;
        const h = sheet.getBoundingClientRect().height;
        const pts = snaps();
        if (moved < 8) {
          const i = pts.reduce((best, v, idx) => Math.abs(v - h) < Math.abs(pts[best] - h) ? idx : best, 0);
          apply(pts[(i + 1) % pts.length], true);
          return;
        }
        apply(pts.reduce((a, b) => Math.abs(b - h) < Math.abs(a - h) ? b : a), true);
      };
      handle.addEventListener("pointerup", endDrag);
      handle.addEventListener("pointercancel", endDrag);
    }

    function bindCatGridScroll(el) {
      if (!el || el.dataset.scrollBound === "1") return;
      el.dataset.scrollBound = "1";
      let dragging = false;
      let moved = false;
      let startX = 0;
      let startLeft = 0;
      let lastX = 0;
      let lastT = 0;
      let velocity = 0;
      let momentumId = 0;

      const stopMomentum = () => {
        if (momentumId) cancelAnimationFrame(momentumId);
        momentumId = 0;
      };

      const glide = () => {
        if (Math.abs(velocity) < 0.08) {
          velocity = 0;
          momentumId = 0;
          return;
        }
        el.scrollLeft -= velocity * 16;
        velocity *= 0.94;
        momentumId = requestAnimationFrame(glide);
      };

      el.addEventListener("wheel", (e) => {
        if (el.classList.contains("is-all")) return;
        if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
        e.preventDefault();
        el.scrollLeft += e.deltaY;
      }, { passive: false });

      el.addEventListener("pointerdown", (e) => {
        if (el.classList.contains("is-all")) return;
        if (e.pointerType === "touch") return;
        if (e.button !== 0) return;
        stopMomentum();
        dragging = true;
        moved = false;
        startX = lastX = e.clientX;
        startLeft = el.scrollLeft;
        lastT = performance.now();
        velocity = 0;
        el.classList.add("is-dragging");
        el.setPointerCapture?.(e.pointerId);
      });

      el.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const dx = e.clientX - startX;
        if (Math.abs(dx) > 4) moved = true;
        el.scrollLeft = startLeft - dx;
        const now = performance.now();
        const dt = Math.max(1, now - lastT);
        velocity = (e.clientX - lastX) / dt;
        lastX = e.clientX;
        lastT = now;
      });

      const endDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        el.classList.remove("is-dragging");
        try { el.releasePointerCapture?.(e.pointerId); } catch (_) {}
        if (moved) {
          e.preventDefault?.();
          velocity *= 14;
          stopMomentum();
          momentumId = requestAnimationFrame(glide);
        }
      };

      el.addEventListener("pointerup", endDrag);
      el.addEventListener("pointercancel", endDrag);
      el.addEventListener("click", (e) => {
        if (!moved) return;
        e.preventDefault();
        e.stopPropagation();
        moved = false;
      }, true);
    }

            if (data.user.role !== "CUSTOMER" && data.user.role !== "ADMIN") {
              throw new Error("Gunakan akun pelanggan");
            }
            token = data.token;
            user = data.user;

              saveDelivery();
            } catch (_) {}
            go("/home");
          };
          const bindAuth = (err) => {
            app.innerHTML = pageLogin(err);
            document.getElementById("toggle-pw")?.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              customerShowPass = !customerShowPass;
              const pw = document.getElementById("pw");
              const btn = document.getElementById("toggle-pw");
              if (pw) pw.type = customerShowPass ? "text" : "password";
              if (btn) {
                btn.setAttribute("aria-label", customerShowPass ? "Sembunyikan kata sandi" : "Lihat kata sandi");
                btn.innerHTML = icon(customerShowPass ? "visibility_off" : "visibility", "text-[22px]");

            document.getElementById("to-register")?.addEventListener("click", () => {
              customerAuthView = "register";
              bindAuth("");
            });
            document.getElementById("to-login")?.addEventListener("click", () => {
              customerAuthView = "login";
              bindAuth("");
            });
            document.getElementById("otp-back")?.addEventListener("click", () => {
              customerAuthView = "register";
              bindAuth("");
            });
            (function bindOtpBoxes() {
              const boxes = [...document.querySelectorAll(".otp-box")];
              if (!boxes.length) return;
              const row = document.getElementById("otp-row");
              const submitBtn = document.getElementById("otp-submit");
              const code = () => boxes.map((b) => b.value).join("");
              const refreshReady = () => submitBtn?.classList.toggle("is-ready", code().length === 6);
              const fillFrom = (raw, start = 0) => {
                const digits = String(raw || "").replace(/\D/g, "");
                if (!digits) return;
                digits.split("").forEach((ch, n) => {
                  const box = boxes[start + n];
                  if (!box) return;
                  box.value = ch;
                  box.classList.add("is-filled");
                  box.classList.remove("otp-pop");
                  void box.offsetWidth;
                  box.classList.add("otp-pop");
                });
                const next = boxes[Math.min(start + digits.length, boxes.length - 1)];
                next?.focus();
                refreshReady();
              };
              boxes[0].focus();
              boxes.forEach((box, i) => {
                box.addEventListener("beforeinput", (e) => {
                  if (e.data && /\D/.test(e.data)) e.preventDefault();
                });
                box.addEventListener("input", () => {
                  const v = box.value.replace(/\D/g, "");
                  if (v.length > 1) {
                    box.value = "";
                    fillFrom(v, i);
                    return;
                  }
                  box.value = v.slice(-1);
                  const filled = !!box.value;
                  box.classList.toggle("is-filled", filled);
                  if (filled) {
                    box.classList.remove("otp-pop");
                    void box.offsetWidth;
                    box.classList.add("otp-pop");
                    if (i < boxes.length - 1) boxes[i + 1].focus();
                  }
                  refreshReady();
                });
                box.addEventListener("keydown", (e) => {
                  if (e.key === "Backspace" && !box.value && i > 0) {
                    boxes[i - 1].value = "";
                    boxes[i - 1].classList.remove("is-filled", "otp-pop");
                    boxes[i - 1].focus();
                    refreshReady();
                    e.preventDefault();
                  } else if (e.key === "ArrowLeft" && i > 0) {
                    boxes[i - 1].focus();
                    e.preventDefault();
                  } else if (e.key === "ArrowRight" && i < boxes.length - 1) {
                    boxes[i + 1].focus();
                    e.preventDefault();
                  }
                });
                box.addEventListener("paste", (e) => {
                  e.preventDefault();
                  fillFrom(e.clipboardData.getData("text"), 0);
                });
                box.addEventListener("focus", () => box.select());
              });
              row?.addEventListener("animationend", () => row.classList.remove("is-shake"));
            })();
            document.getElementById("open-wa-otp")?.addEventListener("click", () => {

        if (parts[0] === "merchant") {

              const saved = await api("/api/customers/me", {
                method: "PATCH",
                body: JSON.stringify({
                  fullName: fd.get("fullName"),
                  phone: fd.get("phone"),
                  email: fd.get("email"),
                  password: fd.get("password") || undefined,
                }),
              });
              user = {
                ...user,
                displayName: saved.fullName || saved.displayName,
                email: saved.email || user.email,
              };
              localStorage.setItem("dk_customer_user", JSON.stringify(user));
              editingProfile = false;
              profileError = "";
              route();
            } catch (ex) {
              profileError = ex.message || "Gagal menyimpan";
              route();
            }
          });
          document.getElementById("logout").onclick = () => {
            token = "";
            user = null;
            localStorage.removeItem("dk_customer_token");
            localStorage.removeItem("dk_customer_user");
            go("/login");
          };
          return;
        }

        go("/home");
      } catch (e) {
        if (String(e.message).includes("401") || String(e.message).toLowerCase().includes("token")) {
          token = "";
          go("/login");
          return;
        }
        app.innerHTML = `<div class="p-8 text-red-600">${e.message}<p class="mt-4"><a class="text-primary" href="#/home">Kembali</a></p></div>`;
      }
    }

    window.addEventListener("hashchange", route);
    const APP_EMBED = new URLSearchParams(location.search).get("app") === "1";
    const splashEl = document.getElementById("dk-splash");
    if (APP_EMBED) {
      splashEl?.remove();
      route();
    } else if (splashEl) {
      const splashMin = new Promise((resolve) => setTimeout(resolve, 1800));
      Promise.all([Promise.resolve().then(route), splashMin]).then(() => {
        splashEl.classList.add("is-leave");
        splashEl.setAttribute("aria-busy", "false");
        setTimeout(() => splashEl.remove(), 400);
      });
    } else {
      route();
    }
  </script>
</body>
</html>
